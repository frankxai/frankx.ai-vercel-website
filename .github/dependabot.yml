# Grouped monthly 2026-10-19 (Week 43 inflow throttle).
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
    time: "06:00"
    timezone: Europe/Amsterdam
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
    major:
      update-types:
      - major
  ignore:
  - dependency-name: tailwindcss
    update-types:
    - "version-update:semver-major"
  - dependency-name: tailwind-merge
    update-types:
    - "version-update:semver-major"
  - dependency-name: typescript
    versions:
    - '>=7'
  - dependency-name: lucide-react
    update-types:
    - "version-update:semver-major"
  - dependency-name: framer-motion
    update-types:
    - "version-update:semver-major"
  - dependency-name: react
    update-types:
    - "version-update:semver-major"
  - dependency-name: react-dom
    update-types:
    - "version-update:semver-major"
  - dependency-name: '@types/react'
    update-types:
    - "version-update:semver-major"
  - dependency-name: '@types/react-dom'
    update-types:
    - "version-update:semver-major"
  commit-message:
    prefix: chore(deps)
  labels:
  - dependencies
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
    time: "06:00"
    timezone: Europe/Amsterdam
  open-pull-requests-limit: 3
  groups:
    actions:
      patterns:
      - "*"
  commit-message:
    prefix: chore(ci)
  labels:
  - dependencies
