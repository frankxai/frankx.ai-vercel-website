# Dependency updates. Grouped on purpose: this estate already carries a large
# open-PR backlog, so ungrouped bumps would add more noise than signal.
# Security updates still arrive individually and immediately — grouping only
# applies to the scheduled version updates below.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      # Majors arrive as one reviewable PR instead of N PRs that each fail to
      # rebase against a moving main and re-run CI on every attempt.
      major:
        update-types: ["major"]
    ignore:
      # Tailwind 3 -> 4 is a config and CSS migration, not a bump. Track it as a
      # planned migration; do not let Dependabot open a PR that cannot build.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # tailwind-merge 3 only understands Tailwind 4 class names; it moves with
      # the Tailwind 4 migration, not before it.
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops the JS compiler API that
      # scripts/tests/build-integrity-contract.test.mjs uses (ts.ScriptTarget).
      # Hold 7 until that test moves off it; 6.x (still the JS compiler) stays open.
      - dependency-name: "typescript"
        versions: [">=7"]
      # lucide-react 1.x removes the brand icons (Github, Instagram, Linkedin,
      # Twitter, Youtube) imported across app/ and components/.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      # framer-motion 14 changes the variants and transition types used by the
      # motion pages; it needs a typed migration pass.
      - dependency-name: "framer-motion"
        update-types: ["version-update:semver-major"]
      # React 19 and its types move as one migration: the global JSX namespace
      # goes away and element props are typed unknown.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]
