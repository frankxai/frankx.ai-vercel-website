name: Review Gate

# Merges are autonomous, so AI review findings are the quality gate: every finding must be answered by the author or
# a repo member (fixed with a commit of this PR, or declined with a reason; P0/P1 need one of those two) before
# merge. Re-runs when reviews, review comments or PR conversation comments change. Resolving a thread without a
# reply has no Actions trigger; re-run the check (`gh run rerun`) or reply on the thread.

on:
  pull_request:
    # 'edited' covers a retarget (e.g. staging -> main): check runs are SHA-scoped, so the base change must re-run.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, staging]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/governance
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every AI review finding answered
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
        run: node scripts/governance/review-gate.mjs
