name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    # 'edited' matters here for the base branch, not the title: a pull_request
    # run builds the merge commit, so this verdict is about one base. Retargeting
    # fires only 'edited', and check runs are SHA-scoped, so without it a green
    # build of the staging merge result stays green on the same head after the
    # pull request is pointed at main, where the merge result differs.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, staging]

# CI is an exact required landing check and test:build-integrity scans workflow
# security controls. Keep it always-reporting; never add paths/paths-ignore.

# Cancel superseded runs on rapid pushes to the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  ci:
    name: CI
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # No `version:` here on purpose. action-setup errors out if the version is
      # specified both here and as `packageManager` in package.json; package.json
      # is the single source of truth, so this step reads it from there.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Before install on purpose: this reads package.json, pnpm-workspace.yaml
      # and pnpm-lock.yaml with node builtins only, and a lockfile whose pins
      # have been silently dropped is still self-consistent enough for
      # --frozen-lockfile to succeed. Installing first would hide it.
      - name: pnpm override guard
        run: node scripts/check-pnpm-overrides.mjs

      - run: pnpm install --frozen-lockfile

      - name: Build integrity contract
        run: pnpm run test:build-integrity

      - name: AgentDB runtime smoke
        run: pnpm run test:agentdb-runtime

      - name: Type Check
        run: pnpm run type-check

      - name: Changelog contract
        run: pnpm run test:changelog-release

      - name: Lint
        run: pnpm run lint

      - name: Language refusal gate
        run: pnpm run ai-slop:audit:strict

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
