name: Merge Gate

# The contract, claims, content and internal-link checks that `merge:gate`
# defines but no workflow ran.
#
# Until 2026-08-05 these existed only as npm scripts. CI ran install,
# test:build-integrity, type-check, lint, ai-slop:audit:strict and build —
# nothing else. 14 of 15 contract tests, claims:audit:strict, content:check and
# both link checkers never executed on a pull request. The homepage contract sat
# broken on main for three days as a direct result.
#
# Deliberately does NOT re-run what ci.yml already covers (type-check, lint,
# ai-slop:audit:strict, build, test:build-integrity). Running them twice would
# double the minutes and give two places to fix one red check.
#
# Steps are grouped so a failure names its own category in the checks UI rather
# than surfacing as one opaque "merge:gate failed".

on:
  pull_request:
    # 'edited' matters here for the base branch, not the title: retargeting a
    # pull request from staging to main fires only 'edited', and check runs are
    # SHA-scoped. Without it, a SUCCESS earned against the staging merge diff
    # stays green on the same head after the retarget, even when the main merge
    # diff contains guarded paths this gate never looked at. Contract Guard
    # already listened for it; this did not.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, staging]
    # No `paths:` filter, and none may be added. This job is a required status
    # check: a pull request that matches no path never gets a result for it, and
    # GitHub blocks that pull request indefinitely. The filter was patched seven
    # times, one file class per patch (next.config.mjs, the lockfile, .github/**,
    # CLAUDE.md and docs, root *.md, eslint.config.*, .agents and .claude), and an
    # eighth class, a .nvmrc-only pull request (#1029), blocked the same way.
    #
    # Scoping the work inside the job from a diff is not the fix. #620 tried it and
    # found that every mechanism turning "did not run" into "succeeded" fails
    # open: a new file class would pass having inspected nothing, where today it
    # is merely stuck. So the job always runs and always judges the whole pull
    # request. Measured 2026-10-21: of the last 120 pull requests one (#1029)
    # missed the old filter, so dropping it costs almost nothing.
    #
    # scripts/tests/required-checks-always-report-contract.test.mjs pins this
    # trigger block and the job name.
    #
    # Merge Gate runs every step on every pull request: 20 minute timeout, about
    # 100 seconds when the pnpm cache is warm.

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the tree: checkout, install, run checks. Nothing writes
# back to the repository, so the token needs nothing beyond contents:read.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  merge-gate:
    name: Merge Gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Cheapest check in the job, and the one that protects the rest: a
      # merge:gate step this workflow forgets to run is enforced on Frank's
      # machine and nowhere else. Node builtins only, so it needs no install.
      - name: merge:gate CI coverage
        run: node scripts/check-merge-gate-coverage.mjs

      # Same class, other direction: the coverage check above protects the list
      # of checks, this protects the list of paths that decides whether any
      # check — or the production build — runs at all. Also node builtins only.
      - name: Deploy and PR path coverage
        run: node scripts/check-deploy-path-coverage.mjs

      - run: pnpm install --frozen-lockfile

      # First, and cheap. A contract test that does not parse cannot protect
      # anything, and that failure is invisible to every check that follows.
      - name: Contract test syntax
        run: pnpm run test:syntax

      # Keep this list in sync with the merge:gate script in package.json. The
      # coverage step below fails the job if it drifts again: test:expert-authority
      # was never listed here, and #441 added test:blog-discoverability and
      # test:social-identity to merge:gate without adding them to this workflow —
      # so the contract that #441 shipped to stop a blog-discoverability
      # regression was itself unenforced on every pull request.
      # It happened a third time on 2026-08-14: #471 added test:checkout-sku and
      # test:auction-bid to merge:gate only, which left main red on this job for
      # every pull request until they were added below.
      - name: Contract tests
        run: |
          pnpm run test:noopener
          pnpm run test:glow-button
          pnpm run test:media-guard
          pnpm run test:homepage-release
          pnpm run test:collaboration-release
          pnpm run test:expert-authority
          pnpm run test:ai-architecture
          pnpm run test:email-safety
          pnpm run test:book-reader
          pnpm run test:checkout-sku
          pnpm run test:auction-bid
          pnpm run test:agentic-life-research
          pnpm run test:community-platform-guide
          pnpm run test:learning-routes
          pnpm run test:blog-discoverability
          pnpm run test:ship-guides
          pnpm run test:social-identity
          pnpm run test:seo-title
          pnpm run test:music-release-registry
          pnpm run test:affiliate-links
          pnpm run test:higgsfield-reader

      - name: Content and claims integrity
        run: |
          pnpm run research:agentic-life:audit
          pnpm run content:check
          pnpm run images:check
          pnpm run claims:audit:strict
          pnpm run learn:check
          pnpm run newsletter:validate

      # check-internal-links.mjs validates against data/route-index.json and
      # documents routes:build as its preflight. `prebuild` regenerates the
      # index, but this job never builds — so without this it would judge a
      # pull request's own route changes against the committed, stale corpus:
      # a new page would be reported as a broken link, a deleted one would pass.
      #
      # Runs the static checker only. links:check:ci boots a dev server, which
      # merge:gate:ci already excludes for that reason; this job matches the
      # repo's existing CI variant rather than re-litigating it.
      - name: Internal links
        run: |
          pnpm run routes:build
          pnpm run links:check:static
          pnpm run test:internal-links

      # Blocks two drift classes that reached production: an alias that shadows
      # a real page (which silently made /llm-hub unreachable for weeks), and
      # the Model Arena naming models the LLM registry has never heard of.
      # Deliberately placed after routes:build for the reason documented above —
      # against the committed index it would miss a page added by this very PR.
      - name: Intelligence surface consistency
        run: pnpm run intelligence:check

      # The external snapshot ships committed, so CI re-checks that every figure
      # in it still carries source/licence/retrieved_at, and that the ingest's
      # normalise + join logic still holds against the committed fixtures. Both
      # are offline — no egress, no API key, no cost.
      - name: External intelligence provenance
        run: |
          pnpm run intelligence:validate
          pnpm run test:intelligence-ingest
          pnpm run test:intelligence-layer

      - name: Workflow definitions
        run: |
          pnpm run workflow:validate
          pnpm run workflow:test
