name: Media Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, staging]

# This workflow is intentionally inert. It exists only to emit a pull_request
# workflow_run event. The default-branch Media Guard Trusted workflow performs
# all checkout, policy loading, inspection, and status reporting.
permissions: {}

jobs:
  request:
    name: Media Guard
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Queue the base-controlled verifier
        shell: bash
        run: |
          echo "Media inspection is performed by the default-branch trusted workflow."
