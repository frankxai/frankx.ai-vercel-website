name: Contract Guard

# Fails a pull request that edits a contract test and a surface that same test
# guards. See scripts/check-contract-guard.mjs for why.
#
# Deliberately separate from ci.yml: this needs full history for merge-base,
# and ci.yml's checkout stays shallow so the build job is not slowed down.
#
# ---------------------------------------------------------------------------
# Why there is no `paths:` filter, and why one must never come back
#
# This is a required status check. GitHub creates no check run at all for a
# workflow whose `paths:` filter excludes every changed file, so the required
# context stayed "expected" forever and the pull request was BLOCKED with every
# other check green and nothing red to fix.
#
# That trap was hit four times. Each was answered by appending the offending
# path to the filter: next.config.mjs (2026-08-14), lockfile-only,
# workflow-only (#599), CLAUDE.md-only (#612). Appending only ever covers a file
# class someone has already been blocked by — #618 (BRANCH_AUDIT.md at the repo
# root) was the fifth, and there is always a sixth.
#
# An earlier attempt at this fix reported the context from a separate workflow
# when the filter excluded everything. Three rounds of security review killed
# it: converting "the guard did not run" into "the guard succeeded", from
# outside the guard, makes every edge case in that translation a bypass —
# SHA-global commit statuses shared between a staging and a main pull request,
# the 3,000-entry cap on the Files API, and merge-ref YAML edits among them.
#
# So the filter is gone instead. This job schedules on every non-draft pull
# request and decides for itself whether it has anything to inspect, reporting
# its own required context either way. Nothing outside the guard ever vouches
# for the guard. A pull request that tries to narrow its scope still runs it,
# because there is no longer a filter to narrow.
#
# The scope list moved to scripts/guard-scope.mjs unchanged. Put a path there,
# never here, and only when this guard genuinely needs to inspect it.
# ---------------------------------------------------------------------------

on:
  pull_request:
    # 'edited' matters: the override is read from the pull request title, so
    # without it, adding [contract-change] after a red run would not re-run the
    # check, and removing it after a green one would leave the check green while
    # the reviewer signal quietly disappeared.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, staging]

concurrency:
  group: contract-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-guard:
    name: Contract Guard
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # merge-base against the base branch needs real history.
          fetch-depth: 0
          persist-credentials: false

      # First real step, before setup-node and before the check itself. Uses the
      # runner's preinstalled node and node builtins only, so the early-exit
      # path is this checkout plus about a second.
      - name: Scope
        id: scope
        run: node scripts/guard-scope.mjs contract-guard

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.in_scope == 'true'
        with:
          node-version: '22'
          # setup-node defaults package-manager-cache to true, sees
          # packageManager: pnpm in package.json, and then fails looking for a
          # pnpm binary this job deliberately never installs.
          package-manager-cache: false

      # No install step on purpose — the check uses only node builtins and git,
      # so it returns a verdict in seconds rather than after a dependency install.
      - name: Check contract guards
        if: steps.scope.outputs.in_scope == 'true'
        run: node scripts/check-contract-guard.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
