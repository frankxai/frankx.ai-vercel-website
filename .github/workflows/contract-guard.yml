name: Contract Guard

# Fails a pull request that edits a contract test and a surface that same test
# guards. See scripts/check-contract-guard.mjs for why.
#
# Deliberately separate from ci.yml: this needs full history for merge-base,
# and ci.yml's checkout stays shallow so the build job is not slowed down.

on:
  pull_request:
    # 'edited' matters: the general override is read from the pull request
    # title, so adding or removing [contract-change] must re-run the check. The
    # override never applies to the protected homepage contract.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, staging]
    # No `paths:` filter, and none may be added. This job is a required status
    # check: a pull request that matches no path never gets a result for it, and
    # GitHub blocks that pull request indefinitely. The filter was patched seven
    # times, one file class per patch (next.config.mjs, the lockfile, .github/**,
    # CLAUDE.md and docs, root *.md, eslint.config.*, .agents and .claude), and an
    # eighth class, a .nvmrc-only pull request (#1029), blocked the same way.
    #
    # Scoping the work inside the job from a diff is not the fix. #620 tried it and
    # found that every mechanism turning "did not run" into "succeeded" fails
    # open: a new file class would pass having inspected nothing, where today it
    # is merely stuck. So the job always runs and always judges the whole pull
    # request. Measured 2026-10-21: of the last 120 pull requests one (#1029)
    # missed the old filter, so dropping it costs almost nothing.
    #
    # scripts/tests/required-checks-always-report-contract.test.mjs pins this
    # trigger block and the job name.
    #
    # Contract Guard needs no scoping logic at all: scripts/check-contract-guard.mjs
    # is driven by the pull request's own diff and exits 0 when no contract test
    # changed alongside a surface it guards.

concurrency:
  group: contract-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-guard:
    name: Contract Guard
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base against the base branch needs real history.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # setup-node defaults package-manager-cache to true, sees
          # packageManager: pnpm in package.json, and then fails looking for a
          # pnpm binary this job deliberately never installs.
          package-manager-cache: false

      # No install step on purpose — the check uses only node builtins and git,
      # so it returns a verdict in seconds rather than after a dependency install.
      - name: Test contract-guard policy
        run: node --test scripts/tests/check-contract-guard.test.mjs

      - name: Check contract guards
        run: node scripts/check-contract-guard.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}