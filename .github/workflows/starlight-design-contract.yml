name: Starlight design contract

on:
  # Deliberately unfiltered, and it must stay that way. The pinned kernel's
  # validate-adoption.mjs rejects any `types:` here — "canonical design job
  # requires an unfiltered pull_request trigger" — so adding one turns this
  # required check red.
  #
  # Known consequence: the default action list is [opened, synchronize,
  # reopened], which omits 'edited'. Retargeting a pull request therefore does
  # not re-run this check, and its SHA-scoped verdict from the old base stands.
  # Every other required context in this repo listens for 'edited' for exactly
  # that reason. This one cannot be fixed here — it needs the rule relaxed in
  # frankxai/starlight-design-intelligence to allow the canonical action list.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  design-contract:
    uses: frankxai/starlight-design-intelligence/.github/workflows/design-contract.yml@80830c60040967956580c761772469664c44dd55
