name: Surface Guard

# Protected surfaces (.github/protected-surfaces.json) are evolved, not replaced: a pull request that touches one
# must carry a Surface change brief.
#
# Trusted by construction: pull_request_target runs this workflow, the guard, its self-test and the registry from
# the BASE branch, so a pull request cannot rewrite the gate that judges it. The PR head is fetched as a git ref and
# only diffed; no PR code is checked out or executed. Because a pull_request_target run attaches to the base commit,
# the verdict is published as the commit status "Surface Guard" on the PR head SHA; that status is what branch
# protection requires.
# No paths filter: a required status must report on every pull request (see merge-gate.yml).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: surface-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  surface-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR head as data
        run: git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Gate self-test (base revision)
        id: selftest
        continue-on-error: true
        run: node --test scripts/tests/governance-gates.test.mjs
      - name: Check protected surfaces (base revision)
        id: guard
        continue-on-error: true
        env:
          PR_HEAD: refs/remotes/pr/head
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/governance/surface-guard.mjs
      - name: Publish the verdict on the PR head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.selftest.outcome == 'success' && steps.guard.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$STATE" -f context="Surface Guard" \
            -f description="Protected surfaces: $STATE (see the run for details)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          test "$STATE" = success
      # An approval covers the head Frank saw. Any new commit withdraws it, whatever the brief says now.
      - name: Withdraw surface approval on new commits
        if: always() && github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'surface-approved')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label surface-approved
