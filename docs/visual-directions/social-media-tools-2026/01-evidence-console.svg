<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-labelledby="title desc">
  <title id="title">Direction one: Evidence Console</title>
  <desc id="desc">A dense, source-forward desktop and mobile direction for comparing social media management tools.</desc>
  <defs>
    <linearGradient id="consoleAmbient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981" stop-opacity=".12"/>
      <stop offset=".52" stop-color="#0a0a0b" stop-opacity="0"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity=".08"/>
    </linearGradient>
    <filter id="consoleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".44"/>
    </filter>
  </defs>

  <rect width="1800" height="1400" fill="#070708"/>
  <rect width="1800" height="1400" fill="url(#consoleAmbient)"/>
  <path d="M0 84H1800M0 1320H1800" stroke="#ffffff" stroke-opacity=".07"/>

  <text x="80" y="72" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="4">DIRECTION 01 · EVIDENCE CONSOLE</text>
  <text x="80" y="130" fill="#f7f7f8" font-family="Poppins, sans-serif" font-size="44" font-weight="700" letter-spacing="-2">The research terminal</text>
  <text x="80" y="166" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="19">Maximum comparability. Minimum editorial theatre. Every recommendation exposes its source and date.</text>

  <g filter="url(#consoleShadow)">
    <rect x="80" y="210" width="1160" height="820" rx="26" fill="#0d0f10" stroke="#ffffff" stroke-opacity=".11"/>
  </g>
  <rect x="80" y="210" width="1160" height="54" rx="26" fill="#141718"/>
  <circle cx="112" cy="237" r="6" fill="#10b981"/>
  <circle cx="134" cy="237" r="6" fill="#06b6d4" fill-opacity=".72"/>
  <circle cx="156" cy="237" r="6" fill="#ffffff" fill-opacity=".18"/>
  <text x="190" y="243" fill="#9ca3af" font-family="JetBrains Mono, monospace" font-size="12">frankx.ai/tools/social-media · verified 2026-08-28</text>

  <text x="118" y="320" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="3">SOCIAL TOOL INTELLIGENCE / 15 PLATFORMS</text>
  <text x="118" y="374" fill="#f7f7f8" font-family="Poppins, sans-serif" font-size="42" font-weight="700" letter-spacing="-2">Choose by operating constraint.</text>
  <text x="118" y="410" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="17">Price is one field. Control plane, evidence, and workflow fit decide the system.</text>

  <g font-family="Inter, sans-serif" font-size="13">
    <rect x="118" y="451" width="168" height="40" rx="20" fill="#10b981"/>
    <text x="145" y="477" fill="#06130f" font-weight="700">Solo founder</text>
    <rect x="298" y="451" width="174" height="40" rx="20" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="326" y="477" fill="#d4d4d8">Creator brand</text>
    <rect x="484" y="451" width="172" height="40" rx="20" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="510" y="477" fill="#d4d4d8">Developer/API</text>
    <rect x="668" y="451" width="154" height="40" rx="20" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="695" y="477" fill="#d4d4d8">Agency</text>
    <rect x="834" y="451" width="172" height="40" rx="20" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="861" y="477" fill="#d4d4d8">Enterprise</text>
  </g>

  <rect x="118" y="526" width="1084" height="50" rx="10" fill="#171a1b"/>
  <g fill="#71717a" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.6">
    <text x="138" y="557">PLATFORM</text><text x="330" y="557">ENTRY</text><text x="448" y="557">ANALYTICS</text><text x="604" y="557">API</text><text x="704" y="557">MCP</text><text x="798" y="557">SELF-HOST</text><text x="938" y="557">FIT SIGNAL</text>
  </g>

