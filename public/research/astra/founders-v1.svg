<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">GPT-6 Astra for founders</title><desc id="desc">One brief. Three surfaces. Three dimensions converge on a shared acceptance decision: Acceptance / Sources, function, handoff. This is an editorial workflow diagram, not a measured performance claim.</desc><rect width="1200" height="630" fill="#0a0a0b"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="76" font-size="22" fill="#9eafa6">FrankX / AI Architecture</text><text x="1136" y="76" text-anchor="end" font-size="18" fill="#9eafa6">September 2026</text><path d="M64 103 H1136" stroke="#34433d"/><text x="64" y="183" font-size="54" font-weight="600" fill="#f1f5f2">GPT-6 Astra for founders</text><text x="64" y="246" font-size="34" fill="#a6b9ae">One brief. Three surfaces.</text><rect x="64" y="308" width="342" height="124" rx="12" fill="#101e1b" stroke="#345447"/><text x="86" y="351" font-size="27" fill="#7cdbb7">ChatGPT</text><text x="86" y="389" font-size="21" fill="#cbd5cf">Clarify the decision</text><path d="M235 432 V463 H600 V486" stroke="#43775f" fill="none" stroke-width="2"/><rect x="427" y="308" width="342" height="124" rx="12" fill="#101e1b" stroke="#345447"/><text x="449" y="351" font-size="27" fill="#7cdbb7">Work</text><text x="449" y="389" font-size="21" fill="#cbd5cf">Produce the package</text><path d="M598 432 V463 H600 V486" stroke="#43775f" fill="none" stroke-width="2"/><rect x="790" y="308" width="342" height="124" rx="12" fill="#101e1b" stroke="#345447"/><text x="812" y="351" font-size="27" fill="#7cdbb7">Codex</text><text x="812" y="389" font-size="21" fill="#cbd5cf">Implement the artifact</text><path d="M961 432 V463 H600 V486" stroke="#43775f" fill="none" stroke-width="2"/><rect x="220" y="486" width="760" height="64" rx="32" fill="#143d2e" stroke="#3b8164"/><text x="600" y="526" text-anchor="middle" font-size="23" fill="#c8f5de">Acceptance / Sources, function, handoff</text><text x="64" y="596" font-size="16" fill="#8fa198">A practical operating model · Evidence before expansion</text></g></svg>