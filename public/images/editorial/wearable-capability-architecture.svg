<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1120" role="img" aria-labelledby="title desc"><title id="title">A capability contract, not a universal glasses API</title><desc id="desc">Conceptual proposed architecture. Device adapters expose only verified capabilities. A host runtime combines device support, permissions and release eligibility, selects audio or display output, and sends minimal context to inference. Model output becomes an untrusted proposal. A policy boundary protects memory, metering and governed tools.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#67e8c6"/></marker></defs><rect width="960" height="1120" rx="24" fill="#0a0d12"/><style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:30px;font-weight:700;fill:#f3f5f8} .sub{font-size:17px;fill:#a8b4c4} .label{font-size:21px;font-weight:700;fill:#f3f5f8} .body{font-size:17px;fill:#c2ccda} .tag{font-size:14px;letter-spacing:1px;fill:#67e8c6;font-weight:700} .edge{stroke:#67e8c6;stroke-width:2;fill:none;marker-end:url(#arrow)} .note{font-size:16px;fill:#a8b4c4}</style><text x="40" y="48" class="tag">PROPOSED REFERENCE ARCHITECTURE</text><text x="40" y="92" class="title">One workflow. Several device contracts.</text><text x="40" y="124" class="sub">No diagram node claims an existing Starlight wearable implementation.</text><rect x="40" y="160" width="280" height="128" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="62" y="194" class="label">Camera / audio</text><text x="62" y="224" class="body">Samsung eyewear</text><text x="62" y="248" class="body">Meta displayless</text><text x="62" y="272" class="body">No spatial UI assumed</text><rect x="340" y="160" width="280" height="128" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="362" y="194" class="label">Display glasses</text><text x="362" y="224" class="body">Meta Ray-Ban Display</text><text x="362" y="248" class="body">Android display glasses</text><text x="362" y="272" class="body">Glanceable UI if supported</text><rect x="640" y="160" width="280" height="128" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="662" y="194" class="label">Headsets / wired XR</text><text x="662" y="224" class="body">Android XR devices</text><text x="662" y="248" class="body">Device-specific spatial APIs</text><text x="662" y="272" class="body">Separate application target</text><path d="M180 288 V326 H480 V346" class="edge"/><path d="M480 288 V346" class="edge"/><path d="M780 288 V326 H480" class="edge"/><rect x="260" y="356" width="440" height="150" rx="16" fill="#111923" stroke="#3f8c7c" stroke-width="2"/><text x="282" y="390" class="label">Host and capability contract</text><text x="282" y="420" class="body">Verified API × runtime grant × release eligibility</text><text x="282" y="444" class="body">Choose input and output per capability</text><text x="282" y="468" class="body">Unknown support → disable / phone fallback</text><path d="M480 506 V556" class="edge"/><rect x="260" y="566" width="440" height="126" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="282" y="600" class="label">Identity + minimal context</text><text x="282" y="630" class="body">Tenant-scoped session; consent; redaction</text><text x="282" y="654" class="body">Bounded frames; no continuous capture default</text><text x="282" y="678" class="body">Keys stay on trusted backend</text><path d="M480 692 V742" class="edge"/><rect x="260" y="752" width="440" height="126" rx="16" fill="#111923" stroke="#3f8c7c" stroke-width="2"/><text x="282" y="786" class="label">Multimodal inference</text><text x="282" y="816" class="body">Context + optional retrieved evidence</text><text x="282" y="840" class="body">Untrusted model output → typed proposal</text><text x="282" y="864" class="body">No model authority to call tools</text><path d="M480 878 V928" class="edge"/><rect x="40" y="938" width="280" height="120" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="62" y="972" class="label">Memory / RAG</text><text x="62" y="1002" class="body">Opt-in retention</text><text x="62" y="1026" class="body">Provenance + deletion</text><text x="62" y="1050" class="body">Tenant boundary</text><rect x="340" y="938" width="280" height="120" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="362" y="972" class="label">Governed execution</text><text x="362" y="1002" class="body">Policy + human confirmation</text><text x="362" y="1026" class="body">Actor-bound proposal digest</text><text x="362" y="1050" class="body">Audit receipt; revoke</text><rect x="640" y="938" width="280" height="120" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="662" y="972" class="label">Usage / output</text><text x="662" y="1002" class="body">Meter requests and cost</text><text x="662" y="1026" class="body">Audio or display response</text><text x="662" y="1050" class="body">Rate and budget limits</text><path d="M480 906 H180 V928" class="edge"/><path d="M480 906 V928" class="edge"/><path d="M480 906 H780 V928" class="edge"/><text x="40" y="1094" class="note">Conceptual design • verified device support must be rechecked before deployment.</text></svg>