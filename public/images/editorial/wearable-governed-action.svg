<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1270" role="img" aria-labelledby="title desc"><title id="title">From a deliberate capture to an approved action</title><desc id="desc">Conceptual proposed workflow. An authenticated wearer deliberately captures a bounded frame and prompt. The gateway checks permission, tenant and limits, then requests inference. The model can only propose. The policy gate blocks disallowed proposals; the user reviews an exact digest. An expiring one-use confirmation authorizes a single safe executor call and creates a receipt. The included starter only records a local receipt and never mutates an external service.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#67e8c6"/></marker></defs><rect width="960" height="1270" rx="24" fill="#0a0d12"/><style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:30px;font-weight:700;fill:#f3f5f8} .sub{font-size:17px;fill:#a8b4c4} .label{font-size:21px;font-weight:700;fill:#f3f5f8} .body{font-size:17px;fill:#c2ccda} .tag{font-size:14px;letter-spacing:1px;fill:#67e8c6;font-weight:700} .edge{stroke:#67e8c6;stroke-width:2;fill:none;marker-end:url(#arrow)} .note{font-size:16px;fill:#a8b4c4}</style><text x="40" y="48" class="tag">PROPOSED GOVERNED WORKFLOW</text><text x="40" y="92" class="title">A model proposes. The wearer approves.</text><text x="40" y="126" class="sub">Starter scope: a local receipt only. Production tool integration is separate work.</text><rect x="240" y="164" width="480" height="102" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="262" y="198" class="label">1. Deliberate capture</text><text x="262" y="228" class="body">Bounded image + prompt + session consent</text><text x="262" y="252" class="body">Audio-only / phone fallback when unsupported</text><path d="M480 266 V302" class="edge"/><rect x="240" y="312" width="480" height="102" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="262" y="346" class="label">2. Gateway validation</text><text x="262" y="376" class="body">Authentication, tenant, file limits, rate / budget</text><text x="262" y="400" class="body">Reject missing permission or malformed payload</text><path d="M480 414 V450" class="edge"/><rect x="240" y="460" width="480" height="102" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="262" y="494" class="label">3. Multimodal inference</text><text x="262" y="524" class="body">Treat visual text and model output as untrusted</text><text x="262" y="548" class="body">Return a typed proposal; never execute it</text><path d="M480 562 V598" class="edge"/><rect x="240" y="608" width="480" height="102" rx="16" fill="#111923" stroke="#c2984e" stroke-width="2"/><text x="262" y="642" class="label">4. Policy and exact preview</text><text x="262" y="672" class="body">Allowlist action and validated arguments</text><text x="262" y="696" class="body">Bind actor, expiry, proposal digest and nonce</text><path d="M480 710 V746" class="edge"/><rect x="240" y="756" width="480" height="102" rx="16" fill="#111923" stroke="#c2984e" stroke-width="2"/><text x="262" y="790" class="label">5. Explicit human confirmation</text><text x="262" y="820" class="body">Show the exact target and payload</text><text x="262" y="844" class="body">Changed payload or expired approval → reject</text><path d="M480 858 V894" class="edge"/><rect x="240" y="904" width="480" height="102" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="262" y="938" class="label">6. Single controlled action</text><text x="262" y="968" class="body">Consume confirmation once; enforce scope again</text><text x="262" y="992" class="body">Starter writes a local demonstration receipt</text><path d="M480 1006 V1042" class="edge"/><rect x="240" y="1052" width="480" height="102" rx="16" fill="#111923" stroke="#253242" stroke-width="2"/><text x="262" y="1086" class="label">7. Result and audit receipt</text><text x="262" y="1116" class="body">Return the actual outcome and usage</text><text x="262" y="1140" class="body">Minimize retained context; provide deletion</text><path d="M720 659 H824 V1120 H720" stroke="#c2984e" stroke-width="2" fill="none"/><text x="757" y="740" class="note">Reject /</text><text x="757" y="764" class="note">cancel /</text><text x="757" y="788" class="note">expire</text><text x="746" y="1189" class="note">No external mutation</text><text x="40" y="1238" class="note">Conceptual design • production needs durable replay protection and provider-specific tool grants.</text></svg>