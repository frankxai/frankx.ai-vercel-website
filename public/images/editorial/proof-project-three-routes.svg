<text x="158" y="450" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="36" font-weight="700">Build a small working answer</text>
<text x="158" y="496" fill="#c5cbc7" font-family="Arial,sans-serif" font-size="28">Tested, with its limits written down.</text>
<rect x="56" y="548" width="848" height="128" rx="16" fill="#15191a" stroke="#303635"/>
<text x="86" y="602" fill="#34d399" font-family="Arial,sans-serif" font-size="32">03</text>
<text x="158" y="602" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="36" font-weight="700">Publish with a walkthrough</text>
<text x="158" y="648" fill="#c5cbc7" font-family="Arial,sans-serif" font-size="28">Your own page plus a 90-second video.</text>
