<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1060" viewBox="0 0 960 1060" role="img" aria-labelledby="title desc">
<title id="title">One project. Three routes.</title><desc id="desc">Pick one problem from the role you want. Build a small working answer. Publish it on your own page with a 90-second walkthrough. Then use it three ways: a role application, a paid pilot, and a feedback loop. FrankX / Career schematic / November 2026</desc>
<rect width="960" height="1060" rx="24" fill="#0a0a0b"/>
<path d="M56 68h60" stroke="#34d399" stroke-width="6"/>
<text x="56" y="139" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="48" font-weight="700">One project. Three routes.</text>
<text x="56" y="194" fill="#b6b9b4" font-family="Arial,sans-serif" font-size="30">Make your skill inspectable before you apply.</text>
<rect x="56" y="244" width="848" height="128" rx="16" fill="#15191a" stroke="#303635"/>
