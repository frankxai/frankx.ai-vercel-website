<text x="158" y="298" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="36" font-weight="700">Pick one problem</text>
<text x="158" y="344" fill="#c5cbc7" font-family="Arial,sans-serif" font-size="28">An outcome that repeats across real postings.</text>
<rect x="56" y="396" width="848" height="128" rx="16" fill="#15191a" stroke="#303635"/>
