  <text x="800" y="102" text-anchor="middle" fill="#67E8F9" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">FRANKX.AI · STARLIGHT LABS</text>
  <text x="800" y="171" text-anchor="middle" fill="url(#title)" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="750" letter-spacing="-2">Expert Authority Intelligence System</text>
  <text x="800" y="217" text-anchor="middle" fill="#A1A1AA" font-family="Inter, Arial, sans-serif" font-size="23">One persistent system. Five governed engines. One compounding learning loop.</text>

