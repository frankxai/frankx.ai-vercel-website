<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Canva for Founders — the FrankX operating graph</title>
  <desc id="desc">A source-led founder brief moves through an agent orchestrator and Canva MCP into human review, owned media, distribution, and measurable learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060809"/>
      <stop offset="1" stop-color="#0b1212"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#10b981" stop-opacity=".18"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <style>
      .display{font-family:Inter,Arial,sans-serif}.mono{font-family:'JetBrains Mono',monospace}.white{fill:#f7faf9}.muted{fill:#8fa19c}.dim{fill:#61716d}.green{fill:#72e1b2}
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="855" cy="210" r="360" fill="url(#glow)"/>
  <path d="M0 568 C220 495 450 650 690 548 S1010 470 1200 532" fill="none" stroke="#10b981" stroke-opacity=".12" stroke-width="1.5"/>

  <text x="64" y="67" class="mono green" font-size="13" letter-spacing="3">CANVA FOR FOUNDERS / AN INDEPENDENT FRANKX GUIDE</text>
  <text x="64" y="139" class="display white" font-size="54" font-weight="700" letter-spacing="-2">Canva is not the strategy.</text>
  <text x="64" y="199" class="display white" font-size="54" font-weight="700" letter-spacing="-2">It is the visual production node.</text>
  <text x="64" y="243" class="display muted" font-size="20">Source-led research in. Governed, branded distribution out.</text>

  <path d="M135 409 C225 365 287 365 372 409 S512 453 602 409 S752 365 837 409 S975 453 1065 409" fill="none" stroke="url(#line)" stroke-width="2" stroke-opacity=".62"/>
  <path d="M372 409 C433 495 535 495 602 409" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5 7" stroke-opacity=".45"/>

  <g class="display" font-size="13">
    <rect x="64" y="365" width="142" height="88" rx="18" fill="#101817" stroke="#10b981" stroke-opacity=".38"/>
    <text x="82" y="397" class="white" font-weight="700">Founder brief</text><text x="82" y="424" class="muted">Intent · evidence</text>
    <rect x="282" y="365" width="180" height="88" rx="18" fill="#101817" stroke="#10b981" stroke-opacity=".38"/>
    <text x="302" y="397" class="white" font-weight="700">Agent orchestrator</text><text x="302" y="424" class="muted">Plan · guardrails</text>
    <rect x="512" y="354" width="180" height="110" rx="22" fill="#171329" stroke="#7d2ae8" stroke-opacity=".92"/>
    <circle cx="542" cy="390" r="13" fill="#7d2ae8"/><text x="566" y="395" class="white" font-weight="700">Canva MCP</text><text x="535" y="431" class="muted">Brand · create · export</text>
    <rect x="742" y="365" width="190" height="88" rx="18" fill="#101817" stroke="#06b6d4" stroke-opacity=".38"/>
    <text x="762" y="397" class="white" font-weight="700">Human release gate</text><text x="762" y="424" class="muted">Claims · rights · taste</text>
    <rect x="982" y="365" width="154" height="88" rx="18" fill="#101817" stroke="#06b6d4" stroke-opacity=".38"/>
    <text x="1002" y="397" class="white" font-weight="700">Demand loop</text><text x="1002" y="424" class="muted">Publish · learn</text>
  </g>
  <g fill="#10b981"><circle cx="135" cy="409" r="5"/><circle cx="372" cy="409" r="5"/><circle cx="602" cy="409" r="5"/></g>
  <g fill="#06b6d4"><circle cx="837" cy="409" r="5"/><circle cx="1065" cy="409" r="5"/></g>

  <rect x="64" y="528" width="1072" height="1" fill="#ffffff" opacity=".1"/>
  <text x="64" y="568" class="mono dim" font-size="11" letter-spacing="2">OFFICIAL MCP · HUMAN APPROVAL · OWNED MEDIA · MEASURABLE LEARNING</text>
  <text x="1032" y="568" class="display white" font-size="16" font-weight="700">frankx.ai</text>
