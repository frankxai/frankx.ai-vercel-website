<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1122" width="1600" height="1122" role="img" aria-labelledby="mcp-hub-light-t mcp-hub-light-d"><title id="mcp-hub-light-t">One MCP hub between agents and tools</title><desc id="mcp-hub-light-d">Three tiers: agent harnesses call an MCP hub that provides a server registry, scoped credentials, tool policy and an audit log, which fronts individual MCP servers.</desc><defs><linearGradient id="mcp-hub-light-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7f8"/><stop offset="1" stop-color="#eef1f3"/></linearGradient><pattern id="mcp-hub-light-dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#0a0a0b" fill-opacity="0.07"/></pattern><marker id="mcp-hub-light-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#8a979b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="mcp-hub-light-glow-emerald" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#10B981" stop-opacity="0.1"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient><linearGradient id="mcp-hub-light-line-emerald" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981" stop-opacity="0.15"/><stop offset="1" stop-color="#10B981" stop-opacity="0.9"/></linearGradient><radialGradient id="mcp-hub-light-glow-violet" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.1"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><linearGradient id="mcp-hub-light-line-violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.15"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0.9"/></linearGradient><radialGradient id="mcp-hub-light-glow-cyan" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.1"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient><linearGradient id="mcp-hub-light-line-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.15"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0.9"/></linearGradient></defs><rect width="1600" height="1122" rx="32" fill="url(#mcp-hub-light-bg)"/><rect width="1600" height="1122" rx="32" fill="url(#mcp-hub-light-dots)"/><text x="80" y="80" fill="#047857" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.4">AI ARCHITECTURE</text><text x="80" y="134" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="46" font-weight="750">One MCP hub between agents and tools</text><text x="80" y="176" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="20" font-weight="400">Agents ask the hub for tools. The hub decides which server answers, with which credentials, and records the</text><text x="80" y="204" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="20" font-weight="400">call.</text><g><rect x="80" y="248" width="1440" height="196" rx="24" fill="#ffffff" stroke="#d5dbde"/><rect x="80" y="248" width="420" height="196" rx="24" fill="url(#mcp-hub-light-glow-violet)"/><rect x="80" y="274" width="4" height="144" rx="2" fill="#7C3AED"/><text x="112" y="312" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="700">Agent harnesses</text><text x="112" y="346" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">Clients that call tools</text><path d="M470 274V418" stroke="#d5dbde"/><rect x="500" y="276" width="318.7" height="62" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="516" y="276" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="516" y="313" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Claude Code</text><rect x="834.7" y="276" width="318.7" height="62" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="850.7" y="276" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="850.7" y="313" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Codex</text><rect x="1169.3" y="276" width="318.7" height="62" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1185.3" y="276" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="1185.3" y="313" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Antigravity</text><rect x="500" y="354" width="318.7" height="62" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="516" y="354" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="516" y="391" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">OpenCode</text><rect x="834.7" y="354" width="318.7" height="62" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="850.7" y="354" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="850.7" y="391" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Grok CLI</text><rect x="1169.3" y="354" width="318.7" height="62" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1185.3" y="354" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="1185.3" y="391" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Hermes</text></g><path d="M800 446V503" stroke="#8a979b" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#mcp-hub-light-arrow)"/><rect x="824" y="461" width="130.3" height="28" rx="14" fill="#ffffff" stroke="#d5dbde"/><text x="840" y="480" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="400">Tool requests</text><g><rect x="80" y="506" width="1440" height="188" rx="24" fill="#ffffff" stroke="#d5dbde"/><rect x="80" y="506" width="420" height="188" rx="24" fill="url(#mcp-hub-light-glow-cyan)"/><rect x="80" y="532" width="4" height="136" rx="2" fill="#06B6D4"/><text x="112" y="570" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="700">MCP hub</text><text x="112" y="604" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">One control point for tool access</text><text x="112" y="639" fill="#0e7490" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="400">e.g. the Starlight tool plane</text><path d="M470 532V668" stroke="#d5dbde"/><rect x="500" y="534" width="235" height="132" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="516" y="534" width="28" height="3" rx="1.5" fill="#06B6D4"/><text x="516" y="571" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Server registry</text><text x="516" y="597" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">One list of approved</text><text x="516" y="617" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">servers</text><rect x="751" y="534" width="235" height="132" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="767" y="534" width="28" height="3" rx="1.5" fill="#06B6D4"/><text x="767" y="571" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Scoped</text><text x="767" y="595" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">credentials</text><text x="767" y="621" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Environment references,</text><text x="767" y="641" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">never inline secrets</text><rect x="1002" y="534" width="235" height="132" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1018" y="534" width="28" height="3" rx="1.5" fill="#06B6D4"/><text x="1018" y="571" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Tool policy</text><text x="1018" y="597" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Read first, writes gated</text><rect x="1253" y="534" width="235" height="132" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1269" y="534" width="28" height="3" rx="1.5" fill="#06B6D4"/><text x="1269" y="571" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Audit log</text><text x="1269" y="597" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Which agent called which</text><text x="1269" y="617" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">tool</text></g><path d="M800 696V753" stroke="#8a979b" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#mcp-hub-light-arrow)"/><rect x="824" y="711" width="183.2" height="28" rx="14" fill="#ffffff" stroke="#d5dbde"/><text x="840" y="730" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="400">Scoped, logged calls</text><g><rect x="80" y="756" width="1440" height="248" rx="24" fill="#ffffff" stroke="#d5dbde"/><rect x="80" y="756" width="420" height="248" rx="24" fill="url(#mcp-hub-light-glow-emerald)"/><rect x="80" y="782" width="4" height="196" rx="2" fill="#10B981"/><text x="112" y="820" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="700">MCP servers</text><text x="112" y="854" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">Each one wraps a system of record</text><path d="M470 782V978" stroke="#d5dbde"/><rect x="500" y="784" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="516" y="784" width="28" height="3" rx="1.5" fill="#10B981"/><text x="516" y="821" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Filesystem</text><text x="516" y="847" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Repos and documents</text><rect x="834.7" y="784" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="850.7" y="784" width="28" height="3" rx="1.5" fill="#10B981"/><text x="850.7" y="821" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Git</text><text x="850.7" y="847" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">History, branches, diffs</text><rect x="1169.3" y="784" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1185.3" y="784" width="28" height="3" rx="1.5" fill="#10B981"/><text x="1185.3" y="821" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Browser</text><text x="1185.3" y="847" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Live, signed-in sessions</text><rect x="500" y="888" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="516" y="888" width="28" height="3" rx="1.5" fill="#10B981"/><text x="516" y="925" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Memory</text><text x="516" y="951" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Vaults and entries</text><rect x="834.7" y="888" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="850.7" y="888" width="28" height="3" rx="1.5" fill="#10B981"/><text x="850.7" y="925" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Deploy</text><text x="850.7" y="951" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Railway and Vercel</text><rect x="1169.3" y="888" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1185.3" y="888" width="28" height="3" rx="1.5" fill="#10B981"/><text x="1185.3" y="925" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Docs</text><text x="1185.3" y="951" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Library documentation</text></g><path d="M80 1060H1520" stroke="#d5dbde" stroke-width="1"/><text x="80" y="1088" fill="#566267" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400">Hub pattern as run in the Starlight tool plane; harness list from the estate harness matrix.</text><text x="1520" y="1088" fill="#566267" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" text-anchor="end" letter-spacing="1">frankx.ai</text></svg>
