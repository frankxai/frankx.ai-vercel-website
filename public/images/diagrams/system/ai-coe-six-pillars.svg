<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1008" width="1600" height="1008" role="img" aria-labelledby="ai-coe-six-pillars-dark-t ai-coe-six-pillars-dark-d"><title id="ai-coe-six-pillars-dark-t">Six pillars of an AI center of excellence</title><desc id="ai-coe-six-pillars-dark-d">Six pillars around an AI center of excellence: strategy, governance, talent, technology, data and ethics, each with a one-line job.</desc><defs><linearGradient id="ai-coe-six-pillars-dark-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a0b"/><stop offset="1" stop-color="#0c1318"/></linearGradient><pattern id="ai-coe-six-pillars-dark-dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/></pattern><marker id="ai-coe-six-pillars-dark-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#5b6a6e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="ai-coe-six-pillars-dark-glow-emerald" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#10B981" stop-opacity="0.16"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient><linearGradient id="ai-coe-six-pillars-dark-line-emerald" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981" stop-opacity="0.15"/><stop offset="1" stop-color="#10B981" stop-opacity="0.9"/></linearGradient><radialGradient id="ai-coe-six-pillars-dark-glow-cyan" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.16"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient><linearGradient id="ai-coe-six-pillars-dark-line-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.15"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0.9"/></linearGradient><radialGradient id="ai-coe-six-pillars-dark-glow-amber" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.16"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient><linearGradient id="ai-coe-six-pillars-dark-line-amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.15"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0.9"/></linearGradient><radialGradient id="ai-coe-six-pillars-dark-glow-violet" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.16"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><linearGradient id="ai-coe-six-pillars-dark-line-violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.15"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0.9"/></linearGradient><radialGradient id="ai-coe-six-pillars-dark-glow-blue" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.16"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient><linearGradient id="ai-coe-six-pillars-dark-line-blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.15"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0.9"/></linearGradient><radialGradient id="ai-coe-six-pillars-dark-glow-fuchsia" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#D946EF" stop-opacity="0.16"/><stop offset="1" stop-color="#D946EF" stop-opacity="0"/></radialGradient><linearGradient id="ai-coe-six-pillars-dark-line-fuchsia" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D946EF" stop-opacity="0.15"/><stop offset="1" stop-color="#D946EF" stop-opacity="0.9"/></linearGradient></defs><rect width="1600" height="1008" rx="32" fill="url(#ai-coe-six-pillars-dark-bg)"/><rect width="1600" height="1008" rx="32" fill="url(#ai-coe-six-pillars-dark-dots)"/><text x="80" y="80" fill="#34d399" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.4">AI CENTER OF EXCELLENCE</text><text x="80" y="134" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="46" font-weight="750">Six pillars of an AI center of excellence</text><text x="80" y="176" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="20" font-weight="400">One operating model that works for a single person, a team or an enterprise program.</text><ellipse cx="800" cy="553" rx="540" ry="268" fill="none" stroke="#262a2e" stroke-dasharray="3 9" stroke-linecap="round"/><ellipse cx="800" cy="553" rx="297" ry="147.4" fill="none" stroke="#262a2e" stroke-dasharray="3 9" stroke-linecap="round"/><path d="M800 553Q894.5 390.5 1070 320.9" fill="none" stroke="#06B6D4" stroke-opacity="0.55" stroke-width="2"/><path d="M800 553Q989 553 1340 553" fill="none" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="2"/><path d="M800 553Q894.5 715.5 1070 785.1" fill="none" stroke="#10B981" stroke-opacity="0.55" stroke-width="2"/><path d="M800 553Q705.5 715.5 530 785.1" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="2"/><path d="M800 553Q611 553 260 553" fill="none" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="2"/><path d="M800 553Q705.5 390.5 530 320.9" fill="none" stroke="#D946EF" stroke-opacity="0.55" stroke-width="2"/><circle cx="800" cy="553" r="124" fill="#121417" stroke="#10B981" stroke-width="2.5"/><circle cx="800" cy="553" r="124" fill="url(#ai-coe-six-pillars-dark-glow-emerald)"/><text x="800" y="540" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="34" font-weight="750" text-anchor="middle">AI CoE</text><text x="800" y="570" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Personal, team or</text><text x="800" y="590" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">enterprise scale</text><rect x="918" y="235.9" width="304" height="170" rx="16" fill="#121417" stroke="#06B6D4" stroke-opacity="0.6"/><rect x="918" y="235.9" width="304" height="170" rx="16" fill="url(#ai-coe-six-pillars-dark-glow-cyan)"/><text x="936" y="267.9" fill="#22d3ee" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">01</text><text x="936" y="297.9" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Strategy</text><text x="936" y="325.9" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Define the work AI should handle,</text><text x="936" y="345.9" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">the work humans keep, and the</text><text x="936" y="365.9" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">outcomes worth measuring.</text><rect x="1188" y="468" width="304" height="170" rx="16" fill="#121417" stroke="#F59E0B" stroke-opacity="0.6"/><rect x="1188" y="468" width="304" height="170" rx="16" fill="url(#ai-coe-six-pillars-dark-glow-amber)"/><text x="1206" y="500" fill="#fbbf24" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">02</text><text x="1206" y="530" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Governance</text><text x="1206" y="558" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Set rules for review, disclosure,</text><text x="1206" y="578" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">privacy, source quality, and</text><text x="1206" y="598" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">final human accountability.</text><rect x="918" y="700.1" width="304" height="170" rx="16" fill="#121417" stroke="#10B981" stroke-opacity="0.6"/><rect x="918" y="700.1" width="304" height="170" rx="16" fill="url(#ai-coe-six-pillars-dark-glow-emerald)"/><text x="936" y="732.1" fill="#34d399" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">03</text><text x="936" y="762.1" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Talent</text><text x="936" y="790.1" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Build fluency through prompts,</text><text x="936" y="810.1" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">playbooks, role-specific</text><text x="936" y="830.1" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">workflows, and repeated practice.</text><rect x="378" y="700.1" width="304" height="170" rx="16" fill="#121417" stroke="#7C3AED" stroke-opacity="0.6"/><rect x="378" y="700.1" width="304" height="170" rx="16" fill="url(#ai-coe-six-pillars-dark-glow-violet)"/><text x="396" y="732.1" fill="#a78bfa" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">04</text><text x="396" y="762.1" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Technology</text><text x="396" y="790.1" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Choose the tool stack</text><text x="396" y="810.1" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">deliberately: models, agents,</text><text x="396" y="830.1" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">automations, interfaces, and</text><text x="396" y="850.1" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">observability.</text><rect x="108" y="468" width="304" height="170" rx="16" fill="#121417" stroke="#3B82F6" stroke-opacity="0.6"/><rect x="108" y="468" width="304" height="170" rx="16" fill="url(#ai-coe-six-pillars-dark-glow-blue)"/><text x="126" y="500" fill="#60a5fa" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">05</text><text x="126" y="530" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Data</text><text x="126" y="558" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Turn documents, notes, research,</text><text x="126" y="578" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">and outputs into reusable context</text><text x="126" y="598" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">with clear ownership.</text><rect x="378" y="235.9" width="304" height="170" rx="16" fill="#121417" stroke="#D946EF" stroke-opacity="0.6"/><rect x="378" y="235.9" width="304" height="170" rx="16" fill="url(#ai-coe-six-pillars-dark-glow-fuchsia)"/><text x="396" y="267.9" fill="#e879f9" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">06</text><text x="396" y="297.9" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Ethics</text><text x="396" y="325.9" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Make values operational through</text><text x="396" y="345.9" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">checks, limits, review moments,</text><text x="396" y="365.9" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">and escalation paths.</text><path d="M80 946H1520" stroke="#262a2e" stroke-width="1"/><text x="80" y="974" fill="#8a9598" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400">Pillar names and descriptions from /ai-coe (app/ai-coe/page.tsx).</text><text x="1520" y="974" fill="#8a9598" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" text-anchor="end" letter-spacing="1">frankx.ai</text></svg>
