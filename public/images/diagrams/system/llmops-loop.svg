<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 716" width="1600" height="716" role="img" aria-labelledby="llmops-loop-dark-t llmops-loop-dark-d"><title id="llmops-loop-dark-t">The LLMOps loop</title><desc id="llmops-loop-dark-d">Five stages in a loop: prompts and data, evaluate, release, observe and improve, with failures from production feeding back into the evaluation set.</desc><defs><linearGradient id="llmops-loop-dark-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a0b"/><stop offset="1" stop-color="#0c1318"/></linearGradient><pattern id="llmops-loop-dark-dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/></pattern><marker id="llmops-loop-dark-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#5b6a6e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="llmops-loop-dark-glow-emerald" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#10B981" stop-opacity="0.16"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient><linearGradient id="llmops-loop-dark-line-emerald" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981" stop-opacity="0.15"/><stop offset="1" stop-color="#10B981" stop-opacity="0.9"/></linearGradient><radialGradient id="llmops-loop-dark-glow-cyan" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.16"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient><linearGradient id="llmops-loop-dark-line-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.15"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0.9"/></linearGradient><radialGradient id="llmops-loop-dark-glow-violet" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.16"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><linearGradient id="llmops-loop-dark-line-violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.15"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0.9"/></linearGradient><radialGradient id="llmops-loop-dark-glow-amber" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.16"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient><linearGradient id="llmops-loop-dark-line-amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.15"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0.9"/></linearGradient><radialGradient id="llmops-loop-dark-glow-fuchsia" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#D946EF" stop-opacity="0.16"/><stop offset="1" stop-color="#D946EF" stop-opacity="0"/></radialGradient><linearGradient id="llmops-loop-dark-line-fuchsia" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D946EF" stop-opacity="0.15"/><stop offset="1" stop-color="#D946EF" stop-opacity="0.9"/></linearGradient></defs><rect width="1600" height="716" rx="32" fill="url(#llmops-loop-dark-bg)"/><rect width="1600" height="716" rx="32" fill="url(#llmops-loop-dark-dots)"/><text x="80" y="80" fill="#34d399" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.4">AI ARCHITECTURE</text><text x="80" y="134" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="46" font-weight="750">The LLMOps loop</text><text x="80" y="176" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="20" font-weight="400">Evaluation gates every release. Production traces become the next evaluation set.</text><rect x="80" y="230" width="252.8" height="280" rx="20" fill="#121417" stroke="#262a2e"/><rect x="80" y="230" width="252.8" height="280" rx="20" fill="url(#llmops-loop-dark-glow-cyan)" opacity="0.8"/><rect x="100" y="230" width="44" height="4" rx="2" fill="#06B6D4"/><text x="100" y="270" fill="#22d3ee" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">01</text><text x="100" y="304" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Prompts and</text><text x="100" y="334" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">data</text><circle cx="104" cy="367" r="3" fill="#06B6D4"/><text x="118" y="372" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">Version prompts,</text><text x="118" y="394" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">datasets and tool</text><text x="118" y="416" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">schemas</text><circle cx="104" cy="447" r="3" fill="#06B6D4"/><text x="118" y="452" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">Pin the model and its</text><text x="118" y="474" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">parameters</text><path d="M349.8 262L358.8 270L349.8 278" fill="none" stroke="#5b6a6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="376.8" y="230" width="252.8" height="280" rx="20" fill="#121417" stroke="#262a2e"/><rect x="376.8" y="230" width="252.8" height="280" rx="20" fill="url(#llmops-loop-dark-glow-violet)" opacity="0.8"/><rect x="396.8" y="230" width="44" height="4" rx="2" fill="#7C3AED"/><text x="396.8" y="270" fill="#a78bfa" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">02</text><text x="396.8" y="304" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Evaluate</text><circle cx="400.8" cy="337" r="3" fill="#7C3AED"/><text x="414.8" y="342" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">Run the eval set</text><text x="414.8" y="364" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">before every change</text><circle cx="400.8" cy="395" r="3" fill="#7C3AED"/><text x="414.8" y="400" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">Score quality, cost</text><text x="414.8" y="422" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">and latency</text><path d="M646.6 262L655.6 270L646.6 278" fill="none" stroke="#5b6a6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="673.6" y="230" width="252.8" height="280" rx="20" fill="#121417" stroke="#262a2e"/><rect x="673.6" y="230" width="252.8" height="280" rx="20" fill="url(#llmops-loop-dark-glow-emerald)" opacity="0.8"/><rect x="693.6" y="230" width="44" height="4" rx="2" fill="#10B981"/><text x="693.6" y="270" fill="#34d399" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">03</text><text x="693.6" y="304" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Release</text><circle cx="697.6" cy="337" r="3" fill="#10B981"/><text x="711.6" y="342" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">Ship behind the AI</text><text x="711.6" y="364" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">gateway</text><circle cx="697.6" cy="395" r="3" fill="#10B981"/><text x="711.6" y="400" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">Canary first, then</text><text x="711.6" y="422" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">widen</text><path d="M943.4 262L952.4 270L943.4 278" fill="none" stroke="#5b6a6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="970.4" y="230" width="252.8" height="280" rx="20" fill="#121417" stroke="#262a2e"/><rect x="970.4" y="230" width="252.8" height="280" rx="20" fill="url(#llmops-loop-dark-glow-amber)" opacity="0.8"/><rect x="990.4" y="230" width="44" height="4" rx="2" fill="#F59E0B"/><text x="990.4" y="270" fill="#fbbf24" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">04</text><text x="990.4" y="304" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Observe</text><circle cx="994.4" cy="337" r="3" fill="#F59E0B"/><text x="1008.4" y="342" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">Trace every call</text><circle cx="994.4" cy="373" r="3" fill="#F59E0B"/><text x="1008.4" y="378" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">Track cost per</text><text x="1008.4" y="400" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">verified outcome</text><path d="M1240.2 262L1249.2 270L1240.2 278" fill="none" stroke="#5b6a6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1267.2" y="230" width="252.8" height="280" rx="20" fill="#121417" stroke="#262a2e"/><rect x="1267.2" y="230" width="252.8" height="280" rx="20" fill="url(#llmops-loop-dark-glow-fuchsia)" opacity="0.8"/><rect x="1287.2" y="230" width="44" height="4" rx="2" fill="#D946EF"/><text x="1287.2" y="270" fill="#e879f9" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">05</text><text x="1287.2" y="304" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700">Improve</text><circle cx="1291.2" cy="337" r="3" fill="#D946EF"/><text x="1305.2" y="342" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">Turn failures into</text><text x="1305.2" y="364" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">eval cases</text><circle cx="1291.2" cy="395" r="3" fill="#D946EF"/><text x="1305.2" y="400" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">Review drift against</text><text x="1305.2" y="422" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="16" font-weight="400">the baseline</text><path d="M1393.6 514V556Q1393.6 574 1375.6 574H224.4Q206.4 574 206.4 556V520" fill="none" stroke="url(#llmops-loop-dark-line-emerald)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#llmops-loop-dark-arrow)"/><rect x="574" y="554" width="451.9" height="40" rx="20" fill="#121417" stroke="#10B981" stroke-opacity="0.7"/><text x="800" y="580" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Production failures become the next eval set</text><path d="M80 654H1520" stroke="#262a2e" stroke-width="1"/><text x="80" y="682" fill="#8a9598" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400">Generic LLMOps lifecycle; release stage assumes the gateway pattern shown in the AI gateway diagram.</text><text x="1520" y="682" fill="#8a9598" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" text-anchor="end" letter-spacing="1">frankx.ai</text></svg>
