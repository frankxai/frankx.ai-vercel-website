<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1113" width="1600" height="1113" role="img" aria-labelledby="ai-gateway-dark-t ai-gateway-dark-d"><title id="ai-gateway-dark-t">Route every model call through one gateway</title><desc id="ai-gateway-dark-d">Three tiers: an agent runtime sends prompts and tool calls to an AI gateway that handles authentication, logging, rate limits, caching, retries and observability, which routes to model providers.</desc><defs><linearGradient id="ai-gateway-dark-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a0b"/><stop offset="1" stop-color="#0c1318"/></linearGradient><pattern id="ai-gateway-dark-dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/></pattern><marker id="ai-gateway-dark-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#5b6a6e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="ai-gateway-dark-glow-emerald" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#10B981" stop-opacity="0.16"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient><linearGradient id="ai-gateway-dark-line-emerald" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981" stop-opacity="0.15"/><stop offset="1" stop-color="#10B981" stop-opacity="0.9"/></linearGradient><radialGradient id="ai-gateway-dark-glow-violet" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.16"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><linearGradient id="ai-gateway-dark-line-violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.15"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0.9"/></linearGradient><radialGradient id="ai-gateway-dark-glow-blue" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.16"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient><linearGradient id="ai-gateway-dark-line-blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.15"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0.9"/></linearGradient></defs><rect width="1600" height="1113" rx="32" fill="url(#ai-gateway-dark-bg)"/><rect width="1600" height="1113" rx="32" fill="url(#ai-gateway-dark-dots)"/><text x="80" y="80" fill="#34d399" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.4">AI ARCHITECTURE</text><text x="80" y="134" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="46" font-weight="750">Route every model call through one gateway</text><text x="80" y="176" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="20" font-weight="400">A control plane between the agent runtime and the models keeps keys, limits and logs in one place.</text><g><rect x="80" y="220" width="1440" height="193" rx="24" fill="#121417" stroke="#262a2e"/><rect x="80" y="220" width="420" height="193" rx="24" fill="url(#ai-gateway-dark-glow-violet)"/><rect x="80" y="246" width="4" height="141" rx="2" fill="#7C3AED"/><text x="112" y="284" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="700">Agent runtime</text><text x="112" y="318" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">Coding agents and apps that need a</text><text x="112" y="341" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">model</text><text x="112" y="376" fill="#a78bfa" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="400">e.g. OpenCode, Claude Code, Codex</text><path d="M470 246V387" stroke="#262a2e"/><rect x="500" y="262.5" width="235" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="516" y="262.5" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="516" y="299.5" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Sessions</text><text x="516" y="325.5" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Conversation and task</text><text x="516" y="345.5" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">state</text><rect x="751" y="262.5" width="235" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="767" y="262.5" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="767" y="299.5" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Context</text><text x="767" y="325.5" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Files, memory and</text><text x="767" y="345.5" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">instructions</text><rect x="1002" y="262.5" width="235" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="1018" y="262.5" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="1018" y="299.5" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Tools</text><text x="1018" y="325.5" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Shell, browser and MCP</text><text x="1018" y="345.5" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">servers</text><rect x="1253" y="262.5" width="235" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="1269" y="262.5" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="1269" y="299.5" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Agent loop</text><text x="1269" y="325.5" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Plan, act, check, repeat</text></g><path d="M800 415V472" stroke="#5b6a6e" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#ai-gateway-dark-arrow)"/><rect x="824" y="430" width="198.3" height="28" rx="14" fill="#121417" stroke="#262a2e"/><text x="840" y="449" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="400">Prompts and tool calls</text><g><rect x="80" y="475" width="1440" height="288" rx="24" fill="#121417" stroke="#262a2e"/><rect x="80" y="475" width="420" height="288" rx="24" fill="url(#ai-gateway-dark-glow-blue)"/><rect x="80" y="501" width="4" height="236" rx="2" fill="#3B82F6"/><text x="112" y="539" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="700">AI gateway</text><text x="112" y="573" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">Operational control plane</text><text x="112" y="608" fill="#60a5fa" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="400">e.g. Cloudflare AI Gateway, LiteLLM,</text><text x="112" y="627" fill="#60a5fa" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="400">Portkey</text><path d="M470 501V737" stroke="#262a2e"/><rect x="500" y="503" width="318.7" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="516" y="503" width="28" height="3" rx="1.5" fill="#3B82F6"/><text x="516" y="540" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Authentication</text><text x="516" y="566" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Provider keys stay off the client</text><rect x="834.7" y="503" width="318.7" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="850.7" y="503" width="28" height="3" rx="1.5" fill="#3B82F6"/><text x="850.7" y="540" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Logging</text><text x="850.7" y="566" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Every request and response recorded</text><rect x="1169.3" y="503" width="318.7" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="1185.3" y="503" width="28" height="3" rx="1.5" fill="#3B82F6"/><text x="1185.3" y="540" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Rate limits</text><text x="1185.3" y="566" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Caps per key, user and model</text><rect x="500" y="627" width="318.7" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="516" y="627" width="28" height="3" rx="1.5" fill="#3B82F6"/><text x="516" y="664" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Caching</text><text x="516" y="690" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Identical requests served from</text><text x="516" y="710" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">cache</text><rect x="834.7" y="627" width="318.7" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="850.7" y="627" width="28" height="3" rx="1.5" fill="#3B82F6"/><text x="850.7" y="664" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Retries</text><text x="850.7" y="690" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Failed calls re-sent or rerouted</text><rect x="1169.3" y="627" width="318.7" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="1185.3" y="627" width="28" height="3" rx="1.5" fill="#3B82F6"/><text x="1185.3" y="664" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Observability</text><text x="1185.3" y="690" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Latency, cost and error traces</text></g><path d="M800 765V822" stroke="#5b6a6e" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#ai-gateway-dark-arrow)"/><rect x="824" y="780" width="228.6" height="28" rx="14" fill="#121417" stroke="#262a2e"/><text x="840" y="799" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="400">Routed, metered and cached</text><g><rect x="80" y="825" width="1440" height="170" rx="24" fill="#121417" stroke="#262a2e"/><rect x="80" y="825" width="420" height="170" rx="24" fill="url(#ai-gateway-dark-glow-emerald)"/><rect x="80" y="851" width="4" height="118" rx="2" fill="#10B981"/><text x="112" y="889" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="700">Model providers</text><text x="112" y="923" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">Inference chosen per request</text><text x="112" y="958" fill="#34d399" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="400">e.g. Workers AI, OCI GenAI</text><path d="M470 851V969" stroke="#262a2e"/><rect x="500" y="856" width="235" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="516" y="856" width="28" height="3" rx="1.5" fill="#10B981"/><text x="516" y="893" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Edge inference</text><text x="516" y="919" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Workers AI and similar</text><rect x="751" y="856" width="235" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="767" y="856" width="28" height="3" rx="1.5" fill="#10B981"/><text x="767" y="893" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Cloud models</text><text x="767" y="919" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">OCI GenAI and other</text><text x="767" y="939" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">hosted APIs</text><rect x="1002" y="856" width="235" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="1018" y="856" width="28" height="3" rx="1.5" fill="#10B981"/><text x="1018" y="893" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Frontier APIs</text><text x="1018" y="919" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Claude, GPT, Gemini</text><rect x="1253" y="856" width="235" height="108" rx="14" fill="#191c20" stroke="#2a2f34"/><rect x="1269" y="856" width="28" height="3" rx="1.5" fill="#10B981"/><text x="1269" y="893" fill="#ffffff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Self-hosted</text><text x="1269" y="919" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Open weights on your own</text><text x="1269" y="939" fill="#b8c0c2" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">GPUs</text></g><path d="M80 1051H1520" stroke="#262a2e" stroke-width="1"/><text x="80" y="1079" fill="#8a9598" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400">Pattern from the OpenCode, AI gateway and Workers AI reference; gateway tools as listed on /ai-ops/architecture.</text><text x="1520" y="1079" fill="#8a9598" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" text-anchor="end" letter-spacing="1">frankx.ai</text></svg>
