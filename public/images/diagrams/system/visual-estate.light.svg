<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1156" width="1600" height="1156" role="img" aria-labelledby="visual-estate-light-t visual-estate-light-d"><title id="visual-estate-light-t">How a diagram is made, stored and served</title><desc id="visual-estate-light-d">Four tiers: specs in git, deterministic render, a registry and asset library, and serving from each brand site's own URL path.</desc><defs><linearGradient id="visual-estate-light-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7f8"/><stop offset="1" stop-color="#eef1f3"/></linearGradient><pattern id="visual-estate-light-dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#0a0a0b" fill-opacity="0.07"/></pattern><marker id="visual-estate-light-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#8a979b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="visual-estate-light-glow-emerald" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#10B981" stop-opacity="0.1"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient><linearGradient id="visual-estate-light-line-emerald" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981" stop-opacity="0.15"/><stop offset="1" stop-color="#10B981" stop-opacity="0.9"/></linearGradient><radialGradient id="visual-estate-light-glow-violet" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.1"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><linearGradient id="visual-estate-light-line-violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.15"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0.9"/></linearGradient><radialGradient id="visual-estate-light-glow-cyan" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.1"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient><linearGradient id="visual-estate-light-line-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.15"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0.9"/></linearGradient><radialGradient id="visual-estate-light-glow-amber" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(0 0.5) scale(1 1.6)"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.1"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient><linearGradient id="visual-estate-light-line-amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.15"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0.9"/></linearGradient></defs><rect width="1600" height="1156" rx="32" fill="url(#visual-estate-light-bg)"/><rect width="1600" height="1156" rx="32" fill="url(#visual-estate-light-dots)"/><text x="80" y="80" fill="#047857" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.4">VISUAL ESTATE, TARGET STATE</text><text x="80" y="134" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="46" font-weight="750">How a diagram is made, stored and served</text><text x="80" y="176" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="20" font-weight="400">Specs in git are the source. Everything else is derived and served from the repo that owns the site.</text><g><rect x="80" y="220" width="1440" height="164" rx="24" fill="#ffffff" stroke="#d5dbde"/><rect x="80" y="220" width="420" height="164" rx="24" fill="url(#visual-estate-light-glow-violet)"/><rect x="80" y="246" width="4" height="112" rx="2" fill="#7C3AED"/><circle cx="130" cy="274" r="18" fill="none" stroke="#7C3AED" stroke-width="2"/><text x="130" y="280.5" fill="#6d28d9" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">1</text><text x="160" y="284" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="700">Source</text><text x="160" y="318" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">Reviewable text in git</text><path d="M470 246V358" stroke="#d5dbde"/><rect x="500" y="248" width="318.7" height="108" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="516" y="248" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="516" y="285" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Diagram specs</text><text x="516" y="311" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">data/diagrams/specs/*.diagram.json</text><rect x="834.7" y="248" width="318.7" height="108" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="850.7" y="248" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="850.7" y="285" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Mermaid and D2</text><text x="850.7" y="311" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">content/blog/diagrams for blog</text><text x="850.7" y="331" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">posts</text><rect x="1169.3" y="248" width="318.7" height="108" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1185.3" y="248" width="28" height="3" rx="1.5" fill="#7C3AED"/><text x="1185.3" y="285" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Prompt sidecars</text><text x="1185.3" y="311" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Provenance for generated art</text></g><path d="M800 386V443" stroke="#8a979b" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#visual-estate-light-arrow)"/><rect x="824" y="401" width="160.5" height="28" rx="14" fill="#ffffff" stroke="#d5dbde"/><text x="840" y="420" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="400">Commit and review</text><g><rect x="80" y="446" width="1440" height="160" rx="24" fill="#ffffff" stroke="#d5dbde"/><rect x="80" y="446" width="420" height="160" rx="24" fill="url(#visual-estate-light-glow-cyan)"/><rect x="80" y="472" width="4" height="108" rx="2" fill="#06B6D4"/><circle cx="130" cy="500" r="18" fill="none" stroke="#06B6D4" stroke-width="2"/><text x="130" y="506.5" fill="#0e7490" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">2</text><text x="160" y="510" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="700">Render</text><text x="160" y="544" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">Deterministic, same input and</text><text x="160" y="567" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">same output</text><path d="M470 472V580" stroke="#d5dbde"/><rect x="500" y="482" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="516" y="482" width="28" height="3" rx="1.5" fill="#06B6D4"/><text x="516" y="519" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">spec-render.mjs</text><text x="516" y="545" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">SVG in dark and light themes</text><rect x="834.7" y="482" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="850.7" y="482" width="28" height="3" rx="1.5" fill="#06B6D4"/><text x="850.7" y="519" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">mmdc and d2</text><text x="850.7" y="545" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Existing blog diagram render</text><rect x="1169.3" y="482" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1185.3" y="482" width="28" height="3" rx="1.5" fill="#06B6D4"/><text x="1185.3" y="519" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Lint on render</text><text x="1185.3" y="545" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Contrast and text fit checked</text></g><path d="M800 608V665" stroke="#8a979b" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#visual-estate-light-arrow)"/><rect x="824" y="623" width="130.3" height="28" rx="14" fill="#ffffff" stroke="#d5dbde"/><text x="840" y="642" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="400">Hash recorded</text><g><rect x="80" y="668" width="1440" height="164" rx="24" fill="#ffffff" stroke="#d5dbde"/><rect x="80" y="668" width="420" height="164" rx="24" fill="url(#visual-estate-light-glow-emerald)"/><rect x="80" y="694" width="4" height="112" rx="2" fill="#10B981"/><circle cx="130" cy="722" r="18" fill="none" stroke="#10B981" stroke-width="2"/><text x="130" y="728.5" fill="#047857" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">3</text><text x="160" y="732" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="700">Registry and library</text><text x="160" y="766" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">What exists, where it is used,</text><text x="160" y="789" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">who approved it</text><path d="M470 694V806" stroke="#d5dbde"/><rect x="500" y="696" width="235" height="108" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="516" y="696" width="28" height="3" rx="1.5" fill="#10B981"/><text x="516" y="733" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Diagram registry</text><text x="516" y="759" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">registry.json with file</text><text x="516" y="779" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">hashes</text><rect x="751" y="696" width="235" height="108" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="767" y="696" width="28" height="3" rx="1.5" fill="#10B981"/><text x="767" y="733" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">VIS asset graph</text><text x="767" y="759" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Local index with rights</text><text x="767" y="779" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">and provenance</text><rect x="1002" y="696" width="235" height="108" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1018" y="696" width="28" height="3" rx="1.5" fill="#10B981"/><text x="1018" y="733" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Visual ledger</text><text x="1018" y="759" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Blog heroes and social</text><text x="1018" y="779" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">cards</text><rect x="1253" y="696" width="235" height="108" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1269" y="696" width="28" height="3" rx="1.5" fill="#10B981"/><text x="1269" y="733" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Creative vault</text><text x="1269" y="759" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Drive and Eagle for human</text><text x="1269" y="779" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">browsing</text></g><path d="M800 834V891" stroke="#8a979b" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#visual-estate-light-arrow)"/><rect x="824" y="849" width="190.8" height="28" rx="14" fill="#ffffff" stroke="#d5dbde"/><text x="840" y="868" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="400">Deploy through Vercel</text><g><rect x="80" y="894" width="1440" height="144" rx="24" fill="#ffffff" stroke="#d5dbde"/><rect x="80" y="894" width="420" height="144" rx="24" fill="url(#visual-estate-light-glow-amber)"/><rect x="80" y="920" width="4" height="92" rx="2" fill="#F59E0B"/><circle cx="130" cy="948" r="18" fill="none" stroke="#F59E0B" stroke-width="2"/><text x="130" y="954.5" fill="#92400e" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">4</text><text x="160" y="958" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="30" font-weight="700">Serve</text><text x="160" y="992" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="17" font-weight="400">Each site serves its own repo</text><path d="M470 920V1012" stroke="#d5dbde"/><rect x="500" y="922" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="516" y="922" width="28" height="3" rx="1.5" fill="#F59E0B"/><text x="516" y="959" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">frankx.ai</text><text x="516" y="985" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">/images/diagrams/system/</text><rect x="834.7" y="922" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="850.7" y="922" width="28" height="3" rx="1.5" fill="#F59E0B"/><text x="850.7" y="959" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">frankx.ai blog</text><text x="850.7" y="985" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">/images/diagrams/blog/</text><rect x="1169.3" y="922" width="318.7" height="88" rx="14" fill="#f1f3f4" stroke="#d9dfe2"/><rect x="1185.3" y="922" width="28" height="3" rx="1.5" fill="#F59E0B"/><text x="1185.3" y="959" fill="#0a0a0b" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="19" font-weight="700">Other brand sites</text><text x="1185.3" y="985" fill="#3f4a4e" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="400">Same pattern, own repo, to be added</text></g><path d="M80 1094H1520" stroke="#d5dbde" stroke-width="1"/><text x="80" y="1122" fill="#566267" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="400">Audit of frankx.ai-vercel-website and visual-intelligence, 2026-11-06. Sites other than frankx.ai are not yet covered.</text><text x="1520" y="1122" fill="#566267" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600" text-anchor="end" letter-spacing="1">frankx.ai</text></svg>
