<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="dual-title dual-desc">
  <title id="dual-title">Agent and human dual-mode verification loop</title>
  <desc id="dual-desc">Shows a human principal reading frankx.ai guides and a sponsored coding agent calling POST /api/mcp, working in parallel across an acoustic wall between Socratic coaching and independent red-gate examination before earning a capability receipt.</desc>
  <defs>
    <linearGradient id="panelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#0a0a0b"/>

  <text x="40" y="50" fill="#34d399" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing="1.8">DUAL-MODE VERIFICATION · HUMAN PRINCIPAL + SPONSORED AGENT</text>
  <text x="40" y="82" fill="#ffffff" font-family="Poppins, Inter, system-ui, sans-serif" font-size="26" font-weight="700">Guide to CLI lab to capability receipt</text>
  <text x="40" y="110" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="15">Agents accelerate retrieval and local test runs via /api/mcp, while an acoustic wall blocks self-attestation at the examiner gate.</text>

  <!-- Left column: Context Entrypoints -->
  <g transform="translate(40, 144)" font-family="Inter, system-ui, sans-serif">
    <rect width="252" height="194" rx="16" fill="url(#panelDark)" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="18" y="30" fill="#34d399" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" font-weight="600">HUMAN ENTRYPOINT</text>
    <text x="18" y="56" fill="#ffffff" font-size="16.5" font-weight="700">frankx.ai/guides/[slug]</text>
    <text x="18" y="84" fill="#cbd5e1" font-size="13">Reads system architecture,</text>
    <text x="18" y="104" fill="#cbd5e1" font-size="13">audience adopt or wait calls,</text>
    <text x="18" y="124" fill="#cbd5e1" font-size="13">and mapped ICP mission card.</text>
    <rect x="16" y="142" width="220" height="36" rx="8" fill="#090d14" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="28" y="165" fill="#e2e8f0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5">Selects lab + SIA route</text>
  </g>

  <g transform="translate(40, 398)" font-family="Inter, system-ui, sans-serif">
    <rect width="252" height="194" rx="16" fill="url(#panelDark)" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="18" y="30" fill="#38bdf8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" font-weight="600">AGENT ENTRYPOINT (READ-ONLY)</text>
    <text x="18" y="56" fill="#ffffff" font-size="16.5" font-weight="700">POST /api/mcp</text>
    <text x="18" y="82" fill="#93c5fd" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5">GET /api/mcp/server-card</text>
    <text x="18" y="106" fill="#cbd5e1" font-size="12.5">• frankx_search_site</text>
    <text x="18" y="126" fill="#cbd5e1" font-size="12.5">• frankx_get_article</text>
    <text x="18" y="146" fill="#cbd5e1" font-size="12.5">• frankx_list_products</text>
    <rect x="16" y="156" width="220" height="26" rx="6" fill="#090d14" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="26" y="173" fill="#94a3b8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5">Stateless HTTP · zero writes</text>
  </g>

  <line x1="296" y1="241" x2="324" y2="241" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="296" y1="495" x2="324" y2="495" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Center Top: Human Execution Lane -->
  <g transform="translate(330, 144)" font-family="Inter, system-ui, sans-serif">
    <rect width="474" height="194" rx="16" fill="url(#panelDark)" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="20" y="30" fill="#34d399" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" font-weight="600">HUMAN PRINCIPAL · AUTHORSHIP &amp; ACCOUNTABILITY</text>
    <text x="20" y="56" fill="#ffffff" font-size="16.5" font-weight="700">Owns architecture decisions and human gates</text>

    <rect x="20" y="74" width="210" height="100" rx="10" fill="#090d14" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="32" y="96" fill="#34d399" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">STEP A · UNAIDED</text>
    <text x="32" y="118" fill="#f8fafc" font-size="13" font-weight="600">15m broken-code triage</text>
    <text x="32" y="138" fill="#cbd5e1" font-size="12">Logs root-cause hypothesis</text>
    <text x="32" y="156" fill="#cbd5e1" font-size="12">before opening agent hints.</text>

    <rect x="244" y="74" width="210" height="100" rx="10" fill="#090d14" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="256" y="96" fill="#34d399" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">STEP B · ADR &amp; REPAIR</text>
    <text x="256" y="118" fill="#f8fafc" font-size="13" font-weight="600">Repairs CLI lab &amp; runbook</text>
    <text x="256" y="138" fill="#cbd5e1" font-size="12">Authors kill criterion,</text>
    <text x="256" y="156" fill="#cbd5e1" font-size="12">rollback, and peer brief.</text>
  </g>

  <!-- Acoustic Wall -->
  <g transform="translate(330, 352)">
    <rect width="474" height="32" rx="8" fill="#1b160c" stroke="#fbbf24" stroke-opacity="0.45" stroke-dasharray="6 4"/>
    <text x="237" y="21" text-anchor="middle" fill="#fbbf24" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" font-weight="600">ACOUSTIC WALL · COACH HINTS CANNOT SIGN EXAMINER RECEIPTS</text>
  </g>

  <!-- Center Bottom: Sponsored Agent Lane -->
  <g transform="translate(330, 398)" font-family="Inter, system-ui, sans-serif">
    <rect width="474" height="194" rx="16" fill="url(#panelDark)" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="20" y="30" fill="#38bdf8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" font-weight="600">SPONSORED AGENT · CLAUDE CODE · CODEX · ANTIGRAVITY</text>
    <text x="20" y="56" fill="#ffffff" font-size="16.5" font-weight="700">Socratic coach &amp; deterministic local harness</text>

    <rect x="20" y="74" width="210" height="100" rx="10" fill="#090d14" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="32" y="96" fill="#38bdf8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">COACH MODE (/hint)</text>
    <text x="32" y="118" fill="#f8fafc" font-size="13" font-weight="600">3-tier diagnostic hints</text>
    <text x="32" y="138" fill="#cbd5e1" font-size="12">Asks targeted questions;</text>
    <text x="32" y="156" fill="#cbd5e1" font-size="12">blocks full answer dumps.</text>

    <rect x="244" y="74" width="210" height="100" rx="10" fill="#090d14" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="256" y="96" fill="#38bdf8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">OFFLINE TEST RUNNER</text>
    <text x="256" y="118" fill="#f8fafc" font-size="13" font-weight="600">pytest + tsc + evals</text>
    <text x="256" y="138" fill="#cbd5e1" font-size="12">Captures exit codes and</text>
    <text x="256" y="156" fill="#cbd5e1" font-size="12">SHA-256 artifact digests.</text>
  </g>

  <line x1="808" y1="241" x2="836" y2="275" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="808" y1="495" x2="836" y2="460" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Right Column: Independent Examiner & Receipt -->
  <g transform="translate(842, 144)" font-family="Inter, system-ui, sans-serif">
    <rect width="318" height="448" rx="16" fill="url(#panelDark)" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text x="20" y="32" fill="#fbbf24" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" font-weight="600">INDEPENDENT EXAMINER KERNEL</text>
    <text x="20" y="58" fill="#ffffff" font-size="18" font-weight="700">Non-compensable red gates</text>
    <text x="20" y="80" fill="#cbd5e1" font-size="12.5">One red-gate failure blocks issuance</text>
    <text x="20" y="98" fill="#cbd5e1" font-size="12.5">regardless of style or prose score.</text>

    <g transform="translate(18, 116)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5">
      <rect width="282" height="38" rx="8" fill="#090d14" stroke="#34d399" stroke-opacity="0.3"/>
      <text x="12" y="24" fill="#34d399">[GATE 1]</text>
      <text x="76" y="24" fill="#f8fafc">Untrusted input quarantined</text>

      <rect y="48" width="282" height="38" rx="8" fill="#090d14" stroke="#34d399" stroke-opacity="0.3"/>
      <text x="12" y="72" fill="#34d399">[GATE 2]</text>
      <text x="76" y="72" fill="#f8fafc">Spend &amp; send fail closed</text>

      <rect y="96" width="282" height="38" rx="8" fill="#090d14" stroke="#34d399" stroke-opacity="0.3"/>
      <text x="12" y="120" fill="#34d399">[GATE 3]</text>
      <text x="76" y="120" fill="#f8fafc">Golden evals &gt;= threshold</text>

      <rect y="144" width="282" height="38" rx="8" fill="#090d14" stroke="#34d399" stroke-opacity="0.3"/>
      <text x="12" y="168" fill="#34d399">[GATE 4]</text>
      <text x="76" y="168" fill="#f8fafc">Restore dry-run exit 0</text>

      <rect y="192" width="282" height="38" rx="8" fill="#090d14" stroke="#34d399" stroke-opacity="0.3"/>
      <text x="12" y="216" fill="#34d399">[GATE 5]</text>
      <text x="76" y="216" fill="#f8fafc">Reviewer != Learner ID</text>
    </g>

    <rect x="18" y="362" width="282" height="68" rx="12" fill="#131c18" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="32" y="385" fill="#34d399" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600">VERIFIED OUTPUT</text>
    <text x="32" y="406" fill="#ffffff" font-size="14" font-weight="700">Capability Receipt issued</text>
    <text x="32" y="422" fill="#cbd5e1" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">starlightintelligence.academy</text>
  </g>
</svg>
