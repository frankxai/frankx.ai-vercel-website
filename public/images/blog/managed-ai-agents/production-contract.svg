<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">Recoverable agent production workflow</title><desc id="desc">A versioned contract enters an execution owner and bounded worker, then review, authorized execution and delivery. Revisions return to the worker within a retry budget. A durable job record records transitions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#72d9bd" stroke-width="1.5"/></marker></defs><rect width="1200" height="1120" rx="28" fill="#0a0a0b"/><g font-family="Inter, Arial, sans-serif"><text x="60" y="58" fill="#72d9bd" font-size="20" font-weight="500">FrankX · Production reference pattern</text><text x="60" y="122" fill="#f2f5f3" font-size="48" font-weight="600">Make every job recoverable</text><text x="60" y="164" fill="#c5cbd0" font-size="23" font-weight="400">One execution owner. Bounded work. Reviewable delivery.</text><rect x="88" y="205" width="734" height="104" rx="20" fill="#141a1d"/><text x="112" y="247" fill="#72d9bd" font-size="20" font-weight="500">01</text><text x="164" y="246" fill="#f2f5f3" font-size="29" font-weight="500">Versioned job contract</text><text x="164" y="284" fill="#c5cbd0" font-size="21" font-weight="400">Inputs · acceptance rule · budget · scoped identity</text><line x1="455" y1="310" x2="455" y2="345" stroke="#72d9bd" stroke-width="2" marker-end="url(#arrow)"/><line x1="824" y1="257" x2="930" y2="257" stroke="#456358" stroke-width="2" stroke-dasharray="5 6"/><rect x="88" y="351" width="734" height="104" rx="20" fill="#141a1d"/><text x="112" y="393" fill="#72d9bd" font-size="20" font-weight="500">02</text><text x="164" y="392" fill="#f2f5f3" font-size="29" font-weight="500">One execution owner</text><text x="164" y="430" fill="#c5cbd0" font-size="21" font-weight="400">Job status · timeout · bounded retries</text><line x1="455" y1="456" x2="455" y2="491" stroke="#72d9bd" stroke-width="2" marker-end="url(#arrow)"/><line x1="824" y1="403" x2="930" y2="403" stroke="#456358" stroke-width="2" stroke-dasharray="5 6"/><rect x="88" y="497" width="734" height="104" rx="20" fill="#141a1d"/><text x="112" y="539" fill="#72d9bd" font-size="20" font-weight="500">03</text><text x="164" y="538" fill="#f2f5f3" font-size="29" font-weight="500">Bounded agent worker</text><text x="164" y="576" fill="#c5cbd0" font-size="21" font-weight="400">Tools · model · isolated workspace</text><line x1="455" y1="602" x2="455" y2="637" stroke="#72d9bd" stroke-width="2" marker-end="url(#arrow)"/><line x1="824" y1="549" x2="930" y2="549" stroke="#456358" stroke-width="2" stroke-dasharray="5 6"/><rect x="88" y="643" width="734" height="104" rx="20" fill="#102b22"/><text x="112" y="685" fill="#72d9bd" font-size="20" font-weight="500">04</text><text x="164" y="684" fill="#f2f5f3" font-size="29" font-weight="500">Policy or human review</text><text x="164" y="722" fill="#c5cbd0" font-size="21" font-weight="400">Draft + evidence → accept or request revision</text><line x1="455" y1="748" x2="455" y2="783" stroke="#72d9bd" stroke-width="2" marker-end="url(#arrow)"/><line x1="824" y1="695" x2="930" y2="695" stroke="#456358" stroke-width="2" stroke-dasharray="5 6"/><rect x="88" y="789" width="734" height="104" rx="20" fill="#141a1d"/><text x="112" y="831" fill="#72d9bd" font-size="20" font-weight="500">05</text><text x="164" y="830" fill="#f2f5f3" font-size="29" font-weight="500">Authorized executor</text><text x="164" y="868" fill="#c5cbd0" font-size="21" font-weight="400">Validated action · idempotency key</text><line x1="455" y1="894" x2="455" y2="929" stroke="#72d9bd" stroke-width="2" marker-end="url(#arrow)"/><line x1="824" y1="841" x2="930" y2="841" stroke="#456358" stroke-width="2" stroke-dasharray="5 6"/><rect x="88" y="935" width="734" height="104" rx="20" fill="#141a1d"/><text x="112" y="977" fill="#72d9bd" font-size="20" font-weight="500">06</text><text x="164" y="976" fill="#f2f5f3" font-size="29" font-weight="500">Delivery receipt</text><text x="164" y="1014" fill="#c5cbd0" font-size="21" font-weight="400">Artifact · destination · cost · acceptance result</text><line x1="824" y1="987" x2="930" y2="987" stroke="#456358" stroke-width="2" stroke-dasharray="5 6"/><rect x="930" y="205" width="210" height="834" rx="20" fill="#11201c"/><text x="955" y="252" fill="#f2f5f3" font-size="25" font-weight="500">Durable</text><text x="955" y="286" fill="#f2f5f3" font-size="25" font-weight="500">job record</text><text x="955" y="394" fill="#c5cbd0" font-size="21" font-weight="400">Tenant + job ID</text><text x="955" y="472" fill="#c5cbd0" font-size="21" font-weight="400">State changes</text><text x="955" y="550" fill="#c5cbd0" font-size="21" font-weight="400">Sources</text><text x="955" y="628" fill="#c5cbd0" font-size="21" font-weight="400">Trace + costs</text><text x="955" y="706" fill="#c5cbd0" font-size="21" font-weight="400">Review result</text><text x="955" y="784" fill="#c5cbd0" font-size="21" font-weight="400">Delivery key</text><path d="M 88 695 H 42 V 549 H 82" fill="none" stroke="#72d9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="58" y="1084" fill="#c5cbd0" font-size="21" font-weight="400">Revision uses the same job ID and retry ceiling. Every transition updates the durable record.</text></g></svg>
