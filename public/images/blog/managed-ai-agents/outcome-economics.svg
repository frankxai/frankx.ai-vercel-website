<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">Cost per accepted outcome</title><desc id="desc">Illustrative arithmetic, not measured performance. Model $200; runtime $40; infrastructure $50; review $2,000. Total $2,290 divided by 900 accepted jobs equals $2.54 after rounding.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#72d9bd" stroke-width="1.5"/></marker></defs><rect width="1200" height="840" rx="28" fill="#0a0a0b"/><g font-family="Inter, Arial, sans-serif"><text x="60" y="58" fill="#72d9bd" font-size="20" font-weight="500">FrankX · Unit economics · Illustrative assumptions</text><text x="60" y="122" fill="#f2f5f3" font-size="48" font-weight="600">What does finished work cost?</text><text x="60" y="164" fill="#c5cbd0" font-size="23" font-weight="400">1,000 jobs attempted. 900 accepted. Review time valued at $60/hour.</text><rect x="60" y="210" width="94.32314410480349" height="38" rx="0" fill="#10b981"/><rect x="154.32314410480348" y="210" width="18.864628820960696" height="38" rx="0" fill="#06b6d4"/><rect x="173.18777292576416" y="210" width="23.580786026200872" height="38" rx="0" fill="#658da2"/><rect x="196.76855895196505" y="210" width="943.2314410480351" height="38" rx="0" fill="#d0d9d6"/><text x="60" y="287" fill="#c5cbd0" font-size="20" font-weight="400">Share of economic cost; bar widths follow the stated amounts.</text><rect x="60" y="326" width="13" height="13" rx="3" fill="#10b981"/><text x="90" y="343" fill="#f2f5f3" font-size="23" font-weight="500">Model</text><text x="432" y="343" fill="#c5cbd0" font-size="22" font-weight="400">1,000 jobs × $0.20</text><text x="982" y="343" fill="#f2f5f3" font-size="27" font-weight="500">$200</text><line x1="60" y1="365" x2="1140" y2="365" stroke="#30383b" stroke-width="2" /><rect x="60" y="392" width="13" height="13" rx="3" fill="#06b6d4"/><text x="90" y="409" fill="#f2f5f3" font-size="23" font-weight="500">Runtime</text><text x="432" y="409" fill="#c5cbd0" font-size="22" font-weight="400">500 running hours × $0.08</text><text x="982" y="409" fill="#f2f5f3" font-size="27" font-weight="500">$40</text><line x1="60" y1="431" x2="1140" y2="431" stroke="#30383b" stroke-width="2" /><rect x="60" y="458" width="13" height="13" rx="3" fill="#658da2"/><text x="90" y="475" fill="#f2f5f3" font-size="23" font-weight="500">Other infrastructure</text><text x="432" y="475" fill="#c5cbd0" font-size="22" font-weight="400">Authored monthly allowance</text><text x="982" y="475" fill="#f2f5f3" font-size="27" font-weight="500">$50</text><line x1="60" y1="497" x2="1140" y2="497" stroke="#30383b" stroke-width="2" /><rect x="60" y="524" width="13" height="13" rx="3" fill="#d0d9d6"/><text x="90" y="541" fill="#f2f5f3" font-size="23" font-weight="500">Human review</text><text x="432" y="541" fill="#c5cbd0" font-size="22" font-weight="400">2 minutes per job × $60/hour</text><text x="982" y="541" fill="#f2f5f3" font-size="27" font-weight="500">$2,000</text><line x1="60" y1="563" x2="1140" y2="563" stroke="#30383b" stroke-width="2" /><rect x="60" y="602" width="1080" height="150" rx="22" fill="#10251f"/><text x="88" y="644" fill="#b8d8cb" font-size="22" font-weight="400">Economic total / accepted outcomes</text><text x="88" y="706" fill="#f2f5f3" font-size="43" font-weight="600">$2,290 / 900</text><text x="680" y="700" fill="#72d9bd" font-size="62" font-weight="600">$2.54</text><text x="878" y="700" fill="#f2f5f3" font-size="23" font-weight="400">per accepted job</text><text x="60" y="795" fill="#c5cbd0" font-size="20" font-weight="400">Technical subtotal: $290. Add tools, retries and incidents when present. No vendor benchmark.</text></g></svg>
