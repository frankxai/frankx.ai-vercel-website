<defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#f59e0b" stroke-width="2" stroke-opacity=".55"/></pattern></defs>
<rect x="520" y="540" width="132.5" height="26" rx="3" fill="#f59e0b"/>
<rect x="652.5" y="540" width="392.5" height="26" fill="url(#h)" stroke="#f59e0b" stroke-opacity=".6"/>
<text x="1057.0" y="559" fill="#f8fafc" font-size="16" font-family="'JetBrains Mono', monospace">≈ $2.10</text>
<text x="664.5" y="590" fill="#94a3b8" font-size="14">three rejected generations paid for</text>
<text x="60" y="676" fill="#64748b" font-size="14">Annual Black Friday prices and each vendor’s published credit costs, read on the vendor pages on November 26, 2026.</text>
<text x="60" y="698" fill="#64748b" font-size="14">ElevenLabs minutes assume the included monthly credits are used for narration. Track your own keep rate.</text>
</svg>
