<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="t">What the Black Friday discount buys per output</title>
<desc id="d">Cost per generation at annual Black Friday prices: a Nano Banana Pro image on Higgsfield Ultra 3K costs $0.03; a 5-second 720p Seedance 2.5 clip costs $0.53 on Ultra 3K and $0.88 on Plus; a narration minute costs about $0.07 on ElevenLabs Creator and $0.06 on Pro. If you keep one clip in four, the Seedance clip on Ultra costs about $2.10 per accepted clip.</desc>
<rect width="1200" height="720" fill="#0b1220"/>
<text x="60" y="58" fill="#67e8f9" font-size="15" font-weight="600" letter-spacing="3">COST PER OUTPUT · ANNUAL BLACK FRIDAY PRICES</text>
<text x="60" y="96" fill="#f8fafc" font-size="26" font-weight="700">The price per generation is not the price per published asset</text>
<path d="M520.0 140V600" stroke="#1e293b" stroke-width="1"/>
<text x="520.0" y="628" fill="#64748b" font-size="14" text-anchor="middle" font-family="'JetBrains Mono', monospace">$0</text>
<path d="M645.0 140V600" stroke="#1e293b" stroke-width="1"/>
<text x="645.0" y="628" fill="#64748b" font-size="14" text-anchor="middle" font-family="'JetBrains Mono', monospace">$0.50</text>
<path d="M770.0 140V600" stroke="#1e293b" stroke-width="1"/>
<text x="770.0" y="628" fill="#64748b" font-size="14" text-anchor="middle" font-family="'JetBrains Mono', monospace">$1.00</text>
<path d="M895.0 140V600" stroke="#1e293b" stroke-width="1"/>
<text x="895.0" y="628" fill="#64748b" font-size="14" text-anchor="middle" font-family="'JetBrains Mono', monospace">$1.50</text>
<path d="M1020.0 140V600" stroke="#1e293b" stroke-width="1"/>
<text x="1020.0" y="628" fill="#64748b" font-size="14" text-anchor="middle" font-family="'JetBrains Mono', monospace">$2.00</text>
<text x="60" y="140" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="2">PER GENERATION</text>
<text x="60" y="188" fill="#e2e8f0" font-size="18" font-weight="600">Nano Banana Pro image</text>
<text x="60" y="210" fill="#94a3b8" font-size="15">Higgsfield Ultra 3K</text>
<rect x="520" y="180" width="7.5" height="26" rx="3" fill="#f59e0b"/>
<text x="539.5" y="199" fill="#f8fafc" font-size="16" font-family="'JetBrains Mono', monospace">$0.03 / image</text>
<text x="60" y="250" fill="#e2e8f0" font-size="18" font-weight="600">Seedance 2.5 clip, 720p, 5 s</text>
<text x="60" y="272" fill="#94a3b8" font-size="15">Higgsfield Ultra 3K</text>
<rect x="520" y="242" width="132.5" height="26" rx="3" fill="#f59e0b"/>
<text x="664.5" y="261" fill="#f8fafc" font-size="16" font-family="'JetBrains Mono', monospace">$0.53 / clip</text>
<text x="60" y="312" fill="#e2e8f0" font-size="18" font-weight="600">Seedance 2.5 clip, 720p, 5 s</text>
<text x="60" y="334" fill="#94a3b8" font-size="15">Higgsfield Plus</text>
<rect x="520" y="304" width="220.0" height="26" rx="3" fill="#f59e0b"/>
<text x="752.0" y="323" fill="#f8fafc" font-size="16" font-family="'JetBrains Mono', monospace">$0.88 / clip</text>
<text x="60" y="374" fill="#e2e8f0" font-size="18" font-weight="600">Narration minute</text>
<text x="60" y="396" fill="#94a3b8" font-size="15">ElevenLabs Creator</text>
<rect x="520" y="366" width="17.5" height="26" rx="3" fill="#06b6d4"/>
<text x="549.5" y="385" fill="#f8fafc" font-size="16" font-family="'JetBrains Mono', monospace">≈ $0.07 / min</text>
<text x="60" y="436" fill="#e2e8f0" font-size="18" font-weight="600">Narration minute</text>
<text x="60" y="458" fill="#94a3b8" font-size="15">ElevenLabs Pro</text>
<rect x="520" y="428" width="15.0" height="26" rx="3" fill="#06b6d4"/>
<text x="547.0" y="447" fill="#f8fafc" font-size="16" font-family="'JetBrains Mono', monospace">≈ $0.06 / min</text>
<path d="M60 484H1140" stroke="#334155"/>
<text x="60" y="514" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="2">PER ACCEPTED CLIP, KEEPING 1 IN 4</text>
