<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pallyy versus Metricool decision map</title>
  <desc id="desc">A four-question decision tree routes a one-brand operator to Pallyy and an analytics, MCP, or multi-brand operator to Metricool, with a 30-day pilot before annual commitment.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8eb3a1" fill-opacity=".65"/></marker><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1600" height="1000" fill="#080b0a"/>
  <g stroke="#f0f0e8" stroke-opacity=".045"><path d="M0 160H1600M0 320H1600M0 480H1600M0 640H1600M0 800H1600"/><path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/></g>
  <text x="78" y="68" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3.5">FRANKX / PALLYY VS METRICOOL / DECISION TREE</text>
  <text x="1522" y="68" fill="#68716d" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">START WITH THE OPERATING CONSTRAINT</text>
  <path d="M78 94H1522" stroke="#f0f0e8" stroke-opacity=".13"/>
  <text x="800" y="172" fill="#f1f1e9" font-family="Georgia, serif" font-size="60" text-anchor="middle">Which complexity will you use?</text>
  <text x="800" y="214" fill="#8b928e" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Do not pay for future sophistication. Prove the current loop.</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(610 278)"><rect width="380" height="112" fill="#151811" stroke="#dfc58e" stroke-opacity=".5"/><text x="190" y="36" fill="#dfc58e" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" text-anchor="middle">QUESTION 01</text><text x="190" y="76" fill="#f1f1e9" font-family="Georgia, serif" font-size="25" text-anchor="middle">One brand and one operator?</text></g>
    <path d="M610 334H344V448M990 334H1256V448" fill="none" stroke="#8eb3a1" stroke-opacity=".5" marker-end="url(#arrow)"/>
    <text x="478" y="322" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">YES</text><text x="1122" y="322" fill="#dfc58e" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">NO / GROWING</text>

    <g transform="translate(144 448)"><rect width="400" height="130" fill="#101513" stroke="#8eb3a1" stroke-opacity=".34"/><text x="22" y="32" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">QUESTION 02</text><text x="22" y="70" fill="#f1f1e9" font-family="Georgia, serif" font-size="24">Is a calm weekly queue enough?</text><text x="22" y="102" fill="#8b928e" font-size="12">Publishing · approvals · useful analytics</text></g>
    <g transform="translate(1056 448)"><rect width="400" height="130" fill="#101513" stroke="#dfc58e" stroke-opacity=".34"/><text x="22" y="32" fill="#dfc58e" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">QUESTION 02</text><text x="22" y="70" fill="#f1f1e9" font-family="Georgia, serif" font-size="24">Will you use analytics or MCP?</text><text x="22" y="102" fill="#8b928e" font-size="12">Reports · competitors · brands · AI assistant</text></g>
    <path d="M344 578V690M1256 578V690" fill="none" stroke="#8eb3a1" stroke-opacity=".5" marker-end="url(#arrow)"/>

    <g transform="translate(144 690)"><rect width="400" height="150" fill="#101a16" stroke="#8eb3a1" stroke-opacity=".52"/><text x="22" y="34" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">START HERE</text><text x="22" y="82" fill="#f1f1e9" font-family="Georgia, serif" font-size="38">Pallyy</text><text x="22" y="116" fill="#cdd1cb" font-size="13">Lower cognitive load · clear one-brand cost</text><circle cx="370" cy="36" r="5" fill="#8eb3a1" filter="url(#glow)"/></g>
    <g transform="translate(1056 690)"><rect width="400" height="150" fill="#1b1a12" stroke="#dfc58e" stroke-opacity=".52"/><text x="22" y="34" fill="#dfc58e" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">START HERE</text><text x="22" y="82" fill="#f1f1e9" font-family="Georgia, serif" font-size="38">Metricool</text><text x="22" y="116" fill="#cdd1cb" font-size="13">Wider intelligence · official MCP surface</text><circle cx="370" cy="36" r="5" fill="#dfc58e" filter="url(#glow)"/></g>

    <path d="M544 766H690M1056 766H910" fill="none" stroke="#8eb3a1" stroke-opacity=".44" marker-end="url(#arrow)"/>
    <g transform="translate(650 694)"><rect width="300" height="142" fill="#0d1110" stroke="#f0f0e8" stroke-opacity=".14"/><text x="150" y="34" fill="#68716d" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2" text-anchor="middle">PROOF GATE</text><text x="150" y="76" fill="#f1f1e9" font-family="Georgia, serif" font-size="25" text-anchor="middle">30-day pilot</text><text x="150" y="108" fill="#8b928e" font-size="12" text-anchor="middle">Then choose monthly or annual</text></g>
  </g>
  <path d="M78 890H1522" stroke="#f0f0e8" stroke-opacity=".13"/>
  <text x="78" y="930" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">PILOT SIGNALS</text>
  <text x="260" y="930" fill="#aab0ac" font-family="Arial, sans-serif" font-size="12">posts shipped</text><text x="500" y="930" fill="#aab0ac" font-family="Arial, sans-serif" font-size="12">hours saved</text><text x="720" y="930" fill="#aab0ac" font-family="Arial, sans-serif" font-size="12">approval failures</text><text x="1000" y="930" fill="#aab0ac" font-family="Arial, sans-serif" font-size="12">reports used</text><text x="1240" y="930" fill="#aab0ac" font-family="Arial, sans-serif" font-size="12">automation failures</text>
</svg>
