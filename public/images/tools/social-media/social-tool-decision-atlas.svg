    <g transform="translate(610 236)">
      <rect width="390" height="116" fill="#121816" stroke="#dfc58e" stroke-opacity=".52"/>
      <text x="20" y="28" fill="#dfc58e" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">FOUNDER ROUTE</text>
      <text x="20" y="63" fill="#f1f1e9" font-family="Georgia, serif" font-size="27">Pallyy → Metricool → Buffer</text>
      <text x="20" y="90" fill="#8b928e" font-size="12">Focused cockpit · analytics upgrade · simple baseline</text>
    </g>
    <g transform="translate(610 366)">
      <rect width="390" height="116" fill="#121816" stroke="#8eb3a1" stroke-opacity=".28"/>
      <text x="20" y="28" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">CREATOR ROUTE</text>
      <text x="20" y="63" fill="#f1f1e9" font-family="Georgia, serif" font-size="27">Typefully → Later → Metricool</text>
      <text x="20" y="90" fill="#8b928e" font-size="12">Text voice · visual planning · broad measurement</text>
    </g>
    <g transform="translate(610 496)">
      <rect width="390" height="116" fill="#121816" stroke="#8eb3a1" stroke-opacity=".28"/>
      <text x="20" y="28" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">DEVELOPER ROUTE</text>
      <text x="20" y="63" fill="#f1f1e9" font-family="Georgia, serif" font-size="27">Ayrshare → Postiz → Upload-Post</text>
      <text x="20" y="90" fill="#8b928e" font-size="12">Managed API · open control · lean white-label</text>
    </g>
    <g transform="translate(610 626)">
      <rect width="390" height="116" fill="#121816" stroke="#8eb3a1" stroke-opacity=".28"/>
      <text x="20" y="28" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">AGENCY ROUTE</text>
      <text x="20" y="63" fill="#f1f1e9" font-family="Georgia, serif" font-size="27">Metricool → SocialBee → Publer</text>
      <text x="20" y="90" fill="#8b928e" font-size="12">Multi-brand cockpit · content ops · lean economics</text>
    </g>
    <g transform="translate(610 756)">
      <rect width="390" height="116" fill="#121816" stroke="#8eb3a1" stroke-opacity=".28"/>
      <text x="20" y="28" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">ENTERPRISE ROUTE</text>
      <text x="20" y="63" fill="#f1f1e9" font-family="Georgia, serif" font-size="27">Sprout → Hootsuite → HubSpot</text>
      <text x="20" y="90" fill="#8b928e" font-size="12">Social governance · suite breadth · CRM attribution</text>
    </g>
  </g>

  <g fill="none" stroke="#8eb3a1" stroke-opacity=".28" stroke-width="1.2">
    <path d="M1000 294C1082 294 1070 358 1134 358"/>
    <path d="M1000 424C1080 424 1072 430 1134 430"/>
    <path d="M1000 554C1080 554 1072 502 1134 502"/>
    <path d="M1000 684C1080 684 1072 574 1134 574"/>
    <path d="M1000 814C1095 814 1072 646 1134 646"/>
  </g>

  <g transform="translate(1134 236)" font-family="Arial, sans-serif">
    <rect width="394" height="636" fill="#0b0f0e" stroke="#eef0e8" stroke-opacity=".14"/>
    <text x="24" y="35" fill="#dfc58e" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2.4">THE SAFE CONTROL PLANE</text>
    <path d="M24 56H370" stroke="#eef0e8" stroke-opacity=".12"/>

    <g transform="translate(24 86)">
      <rect width="346" height="72" fill="#121816" stroke="#eef0e8" stroke-opacity=".1"/>
      <text x="16" y="26" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="9">01 / SOURCE</text>
      <text x="16" y="52" fill="#f1f1e9" font-family="Georgia, serif" font-size="20">Brand memory + evidence</text>
    </g>
    <path d="M197 158V184" stroke="#dfc58e" stroke-opacity=".5"/>
    <g transform="translate(24 184)">
      <rect width="346" height="72" fill="#121816" stroke="#eef0e8" stroke-opacity=".1"/>
      <text x="16" y="26" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="9">02 / AGENTS</text>
      <text x="16" y="52" fill="#f1f1e9" font-family="Georgia, serif" font-size="20">Research · plan · adapt</text>
    </g>
    <path d="M197 256V282" stroke="#dfc58e" stroke-opacity=".5"/>
    <g transform="translate(24 282)">
      <rect width="346" height="72" fill="#201d14" stroke="#dfc58e" stroke-opacity=".46"/>
      <text x="16" y="26" fill="#dfc58e" font-family="ui-monospace, monospace" font-size="9">03 / AUTHORITY</text>
      <text x="16" y="52" fill="#f1f1e9" font-family="Georgia, serif" font-size="20">Named human approval</text>
    </g>
    <path d="M197 354V380" stroke="#dfc58e" stroke-opacity=".5"/>
    <g transform="translate(24 380)">
      <rect width="346" height="72" fill="#121816" stroke="#eef0e8" stroke-opacity=".1"/>
      <text x="16" y="26" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="9">04 / SIDE EFFECT</text>
      <text x="16" y="52" fill="#f1f1e9" font-family="Georgia, serif" font-size="20">API / MCP publication</text>
    </g>
    <path d="M197 452V478" stroke="#dfc58e" stroke-opacity=".5"/>
    <g transform="translate(24 478)">
      <rect width="346" height="72" fill="#101a16" stroke="#8eb3a1" stroke-opacity=".3"/>
      <text x="16" y="26" fill="#8eb3a1" font-family="ui-monospace, monospace" font-size="9">05 / LEARNING</text>
      <text x="16" y="52" fill="#f1f1e9" font-family="Georgia, serif" font-size="20">Receipt → measure → brief</text>
    </g>
    <text x="24" y="596" fill="#6f7874" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.1">THE SCHEDULER IS NOT MEMORY.</text>
  </g>

  <path d="M72 914H1528" stroke="#eef0e8" stroke-opacity=".12"/>
  <text x="72" y="944" fill="#6e7873" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">OFFICIAL SOURCES VERIFIED 28 AUG 2026 · RECOMMENDATIONS ARE EDITORIAL · COMMERCIAL STATUS DOES NOT AFFECT FIT</text>
</svg>
