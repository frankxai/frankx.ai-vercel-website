<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gedächtnis-Palast: Loci-Methode — FrankX Denkspiele</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { touch-action: none; -webkit-user-select: none; user-select: none; }
    .palace-room { transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .palace-room:active { transform: scale(0.94); }
  </style>
  <script type="module" crossorigin src="/game-embeds/assets/gedaechtnisPalast-DQZRjq8Q.js"></script>
  <link rel="modulepreload" crossorigin href="/game-embeds/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body class="h-full flex flex-col items-center justify-center overflow-hidden bg-[#0a0814]">

  <!-- Mobile Viewport Frame -->
  <div class="relative w-full h-full max-w-[480px] max-h-[880px] flex flex-col shadow-2xl bg-[#0f0c1e] overflow-hidden sm:rounded-3xl border border-violet-500/30 p-5 justify-between">
    
    <!-- Top Bar -->
    <div class="flex items-center justify-between z-20 pb-3 border-b border-white/10">
      <div class="flex items-center gap-2">
        <div class="p-2 rounded-xl bg-violet-500/10 border border-violet-500/30 text-violet-400 font-bold text-xs">
          🏛️ Palast
        </div>
        <div>
          <div class="text-[10px] text-white/40 uppercase font-semibold">Loci-Methode</div>
          <div class="text-xs font-bold text-violet-300" id="phase-display">Phase 1: Einprägen</div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="text-right">
          <div class="text-[10px] text-white/40 uppercase font-semibold">Erinnerung</div>
          <div class="text-sm font-mono font-bold text-emerald-400" id="score-display">0</div>
        </div>
        <button id="btn-audio" class="p-2 rounded-full bg-slate-900 text-violet-400 border border-violet-700/40 text-xs">
          🔊
        </button>
      </div>
    </div>

    <!-- Center Memory Palace Grid -->
    <div class="my-auto flex flex-col items-center justify-center w-full py-2">
      
      <div class="text-xs text-white/50 text-center mb-3" id="instruction-text">
        Präge dir ein, welches Artefakt in welchem Palast-Raum platziert ist.
      </div>

      <!-- 3x3 Isometric Room Grid -->
      <div id="palace-grid" class="grid grid-cols-3 gap-3 w-full max-w-[340px] aspect-square p-3 bg-slate-950/60 rounded-2xl border border-white/10 shadow-inner">
        <!-- 9 Palace Chambers -->
      </div>

      <!-- Target Query Prompt (During Recall Phase) -->
      <div id="query-box" class="h-10 mt-3 flex items-center justify-center text-xs font-bold text-amber-300"></div>
    </div>

    <!-- Bottom Controls & Action Bar -->
    <div class="space-y-3 z-20">
      <div class="flex items-center gap-3">
        <button id="btn-action" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white text-xs font-bold shadow-lg shadow-violet-500/20 active:scale-95 transition-transform">
          Bereit zum Abfragen (Start)
        </button>
      </div>

      <div class="text-center">
        <p class="text-[10px] text-white/30">
          Kognitives Ziel: Hippocampus & Räumliches Gedächtnis (Loci-Assoziation)
        </p>
      </div>
    </div>

  </div>

</body>
</html>
