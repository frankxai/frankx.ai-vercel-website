<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WortSchatz: Wort-Alchemie — FrankX Denkspiele</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { touch-action: none; -webkit-user-select: none; user-select: none; }
    .syllable-card { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .syllable-card:active { transform: scale(0.92); }
  </style>
  <script type="module" crossorigin src="/game-embeds/assets/wortSchatz-DnGIIUSp.js"></script>
  <link rel="modulepreload" crossorigin href="/game-embeds/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body class="h-full flex flex-col items-center justify-center overflow-hidden bg-[#0a0d14]">

  <!-- Main Viewport Frame -->
  <div class="relative w-full h-full max-w-[480px] max-h-[880px] flex flex-col shadow-2xl bg-[#0d121e] overflow-hidden sm:rounded-3xl border border-amber-500/30 p-5 justify-between">
    
    <!-- Top Stats Bar -->
    <div class="flex items-center justify-between z-20 pb-3 border-b border-white/10">
      <div class="flex items-center gap-2">
        <div class="p-2 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 font-bold text-xs">
          🇩🇪 WortSchatz
        </div>
        <div>
          <div class="text-[10px] text-white/40 uppercase font-semibold">Wort-Alchemie</div>
          <div class="text-xs font-bold text-amber-300" id="level-display">Stufe 1 • Anfänger</div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="text-right">
          <div class="text-[10px] text-white/40 uppercase font-semibold">Punkte</div>
          <div class="text-sm font-mono font-bold text-emerald-400" id="score-display">0</div>
        </div>
        <button id="btn-audio" class="p-2 rounded-full bg-slate-900 text-amber-400 border border-amber-700/40 text-xs">
          🔊
        </button>
      </div>
    </div>

    <!-- Center Word Crucible (Target & Current Assembly) -->
    <div class="my-auto flex flex-col items-center justify-center text-center py-4">
      
      <!-- Target Hint / Meaning -->
      <div class="mb-2 px-3 py-1 rounded-full bg-white/[0.04] border border-white/10 text-xs text-white/60 font-medium" id="hint-display">
        Bedeutung: Plötzlicher genialer Einfall
      </div>

      <!-- Word Drop Zone / Active Slot -->
      <div id="active-word-box" class="min-h-[64px] min-w-[280px] px-4 py-3 rounded-2xl bg-amber-950/20 border-2 border-dashed border-amber-500/40 flex items-center justify-center gap-2 flex-wrap shadow-inner">
        <span class="text-white/30 text-xs tracking-wider" id="placeholder-text">Wähle Silben aus</span>
      </div>

      <!-- Feedback / Word Meaning Box -->
      <div id="feedback-msg" class="h-6 mt-3 text-xs font-semibold text-amber-400"></div>
    </div>

    <!-- Bottom Syllables Grid & Action Buttons -->
    <div class="space-y-4 z-20">
      
      <!-- Syllable Bank -->
      <div id="syllables-grid" class="grid grid-cols-3 gap-2.5">
        <!-- Syllable buttons dynamically inserted -->
      </div>

      <!-- Control Actions -->
      <div class="flex items-center gap-3">
        <button id="btn-clear" class="flex-1 py-3 rounded-xl bg-white/[0.05] border border-white/10 hover:bg-white/[0.1] text-xs font-semibold text-white/70 active:scale-95 transition-transform">
          Zurücksetzen (⌫)
        </button>
        <button id="btn-submit" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 text-xs font-bold shadow-lg shadow-amber-500/20 active:scale-95 transition-transform">
          Wort Prüfen (✓)
        </button>
      </div>

      <!-- Cognitive Indicator -->
      <div class="text-center">
        <p class="text-[10px] text-white/30">
          Kognitives Training: Semantischer Abruf & Wortschatz-Flexibilität (Broca-Areal)
        </p>
      </div>
    </div>

  </div>

</body>
</html>
