<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scharade Party: Pantomime & Gesten — FrankX Games</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { touch-action: none; -webkit-user-select: none; user-select: none; }
    .card-zoom { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  </style>
  <script type="module" crossorigin src="/game-embeds/assets/scharadeParty-CfinJzKV.js"></script>
  <link rel="modulepreload" crossorigin href="/game-embeds/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body class="h-full flex flex-col items-center justify-center overflow-hidden bg-[#0d0714]">

  <!-- Mobile Viewport Frame -->
  <div class="relative w-full h-full max-w-[480px] max-h-[880px] flex flex-col shadow-2xl bg-[#140b20] overflow-hidden sm:rounded-3xl border border-fuchsia-500/30 p-5 justify-between">
    
    <!-- Top Scoreboard: Team Blau vs Team Rot -->
    <div class="grid grid-cols-2 gap-3 z-20 pb-3 border-b border-white/10">
      <div class="p-2.5 rounded-xl bg-blue-950/40 border border-blue-500/40 flex items-center justify-between">
        <div>
          <div class="text-[9px] text-blue-300/60 uppercase font-bold">Team Blau 🔵</div>
          <div class="text-lg font-mono font-extrabold text-blue-400" id="score-blue">0</div>
        </div>
        <button id="btn-add-blue" class="px-2 py-1 bg-blue-600/30 rounded text-xs text-blue-300 font-bold hover:bg-blue-600/50">+1</button>
      </div>

      <div class="p-2.5 rounded-xl bg-rose-950/40 border border-rose-500/40 flex items-center justify-between">
        <div>
          <div class="text-[9px] text-rose-300/60 uppercase font-bold">Team Rot 🔴</div>
          <div class="text-lg font-mono font-extrabold text-rose-400" id="score-red">0</div>
        </div>
        <button id="btn-add-red" class="px-2 py-1 bg-rose-600/30 rounded text-xs text-rose-300 font-bold hover:bg-rose-600/50">+1</button>
      </div>
    </div>

    <!-- Category Selector Tabs -->
    <div class="flex gap-1.5 overflow-x-auto py-2 z-20" id="category-tabs">
      <button class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-fuchsia-500 text-slate-950" data-cat="all">🌟 Alle</button>
      <button class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white/5 text-white/70" data-cat="movies">🎬 Filme</button>
      <button class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white/5 text-white/70" data-cat="animals">🐾 Tiere</button>
      <button class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white/5 text-white/70" data-cat="jobs">🚀 Berufe</button>
      <button class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white/5 text-white/70" data-cat="idioms">🎭 Sprüche</button>
    </div>

    <!-- Center Card & Timer Display -->
    <div class="my-auto flex flex-col items-center justify-center text-center py-2">
      
      <!-- Huge Countdown Timer -->
      <div class="flex items-center gap-2 mb-3">
        <div class="text-3xl font-mono font-extrabold text-amber-400" id="timer-display">60s</div>
        <button id="btn-timer-toggle" class="px-2.5 py-1 rounded-md bg-white/10 text-xs font-bold text-white hover:bg-white/20">
          ▶ Start
        </button>
      </div>

      <!-- Main Charade Prompt Card -->
      <div class="card-zoom w-full min-h-[160px] p-6 rounded-3xl bg-gradient-to-br from-fuchsia-950/40 to-indigo-950/40 border-2 border-fuchsia-500/40 shadow-2xl flex flex-col items-center justify-center relative">
        <div class="text-xs uppercase tracking-widest text-fuchsia-300/60 font-semibold mb-2" id="prompt-category">
          🎬 Film & Serie
        </div>
        <div class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide leading-tight" id="prompt-text">
          Der König der Löwen
        </div>
        <div class="text-xs text-white/40 mt-3 italic" id="prompt-hint">
          Regel: Keine Geräusche, nur Gestik & Mimik!
        </div>
      </div>

      <!-- Language Toggle -->
      <div class="mt-3 flex items-center gap-2">
        <button id="btn-lang" class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-[11px] text-white/70">
          Sprache: 🇩🇪 Deutsch
        </button>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="space-y-3 z-20">
      <div class="grid grid-cols-2 gap-3">
        <button id="btn-pass" class="py-3.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-xs font-bold text-white/70 active:scale-95 transition-transform">
          Weitergeben (Pass ⏭)
        </button>
        <button id="btn-correct" class="py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 text-xs font-extrabold shadow-lg shadow-emerald-500/20 active:scale-95 transition-transform">
          Erraten! (Punkt +1 ✓)
        </button>
      </div>

      <div class="text-center">
        <p class="text-[10px] text-white/30">
          Party-Modus: Ideal für Gruppen, Spieleabende oder Chromecast/AirPlay TV-Casting!
        </p>
      </div>
    </div>

  </div>

</body>
</html>
