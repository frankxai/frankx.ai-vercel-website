<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chrono Shift: Void Breach — Starlight Games</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
  <script type="module" crossorigin src="/assets/chronoShift-CMM9l4Do.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/haptics-bridge-DKVtbgAb.js">
</head>
<body class="h-full flex flex-col items-center justify-center overflow-hidden bg-[#070913]">

  <!-- Mobile Viewport Container -->
  <div class="relative w-full h-full max-w-[480px] max-h-[880px] flex flex-col shadow-2xl bg-black overflow-hidden sm:rounded-3xl border border-slate-800/80">
    
    <!-- Top Action Bar -->
    <div class="absolute top-3 right-3 z-30 flex items-center gap-2">
      <button id="btn-audio" class="p-2.5 rounded-full bg-slate-900/80 text-cyan-400 border border-slate-700/60 shadow-lg backdrop-blur-md active:scale-95 transition-transform" title="Toggle Sound">
        🔊
      </button>
      <a href="../../index.html" class="p-2.5 rounded-full bg-slate-900/80 text-slate-300 border border-slate-700/60 shadow-lg backdrop-blur-md active:scale-95 transition-transform" title="Exit to Hub">
        ✕
      </a>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas" width="440" height="800" class="w-full h-full block cursor-crosshair"></canvas>

    <!-- Tech Foundry Modal (Upgrade Shop) -->
    <div id="shop-modal" class="hidden absolute inset-0 z-40 bg-slate-950/90 backdrop-blur-lg flex flex-col p-6 overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
        <div>
          <h2 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">TECH FOUNDRY</h2>
          <p class="text-xs text-slate-400">Upgrade ship core systems with harvested Chronitons</p>
        </div>
        <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800">
          <span class="text-amber-400 font-bold text-sm">💎</span>
          <span id="shop-currency" class="font-extrabold text-white text-sm">0</span>
        </div>
      </div>

      <div id="shop-items-list" class="flex-1 overflow-y-auto">
        <!-- Injected via game.js -->
      </div>

      <button id="btn-close-shop" class="mt-4 w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold text-sm shadow-lg shadow-cyan-500/20 active:scale-98 transition-transform cursor-pointer">
        RESUME MISSION
      </button>
    </div>

  </div>

</body>
</html>
